        custom:
          type: array
          items:
            $ref: '#/components/schemas/CustomTheme'
          example: []
      description: Installed preset catalog and saved custom themes. The example shows one preset entry; GET
        returns every installed preset.
    ThemeCopyFrom:
      type: object
      additionalProperties: false
      required:
      - id
      - expectedRevision
      properties:
        id:
          type: string
          example: theme:11111111-1111-4111-8111-111111111111
        expectedRevision:
          $ref: '#/components/schemas/PresentationRevision'
      description: Copy a saved custom snapshot at an explicit revision. Later source edits do not change
        the copy.
    ThemeCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        brandLogoId:
          type: string
          maxLength: 200
          example: upload:LOGO
          description: Logo reference for an explicit definition; empty uses the Balemoh logo. Omission retains legacy shared icon behavior. A copyFrom request inherits both source images.
        brandIconId:
          type: string
          maxLength: 200
          example: upload:EXAMPLE
          description: Image reference for an explicit definition. A copyFrom request inherits the source theme image.
        id:
          type: string
          example: theme:11111111-1111-4111-8111-111111111111
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Ocean
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
        copyFrom:
          $ref: '#/components/schemas/ThemeCopyFrom'
      description: Supply exactly one of definition or copyFrom. Creates inactive theme. Same ID and creation
        payload returns 200; changed payload conflicts. Maximum 128 saved themes.
    ThemeRename:
      type: object
      additionalProperties: false
      required:
      - name
      - expectedRevision
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Ocean renamed
        expectedRevision:
          $ref: '#/components/schemas/PresentationRevision'
      description: Metadata-only name change guarded by the current theme revision. Selection and definition
        stay unchanged.
    UploadedFont:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - family
      - weight
      - style
      - variable
      - format
      - mime
      - byteLength
      - digest
      - revision
      - usedBy
      properties:
        id:
          type: string
          example: font:11111111-1111-4111-8111-111111111111
        name:
          type: string
          example: Go Regular
        family:
          type: string
          example: Go
        weight:
          type: string
          example: '400'
        style:
          type: string
          example: normal
        variable:
          type: boolean
          example: false
        format:
          type: string
          example: truetype
        mime:
          type: string
          example: font/ttf
        byteLength:
          type: integer
          maximum: 10485760
          example: 148672
        digest:
          type: string
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        revision:
          $ref: '#/components/schemas/PresentationRevision'
        usedBy:
          type: array
          items:
            type: string
          example: []
      description: Metadata derived from uploaded bytes. Each file is independent, including variable fonts.
        Lists omit file bytes.
    PresentationConflict:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - settings
          - theme
          - font
          - catalog
          - command
          example: settings
        id:
          type: string
        currentRevision:
          type: string
          example: '2'
      description: Resource and current revision explaining a rejected command. Never silently replace the
        draft revision.
    PresentationRevision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: Decimal optimistic revision. Copy it from the corresponding read response. Missing revisions
        never mean overwrite.
      example: '1'
      x-go-type: string
servers:
  - url: http://127.0.0.1:8080
    description: Local development API. Replace with your private API origin; the static documentation host
      does not serve this API.
security: []
tags:
  - name: Presentation
    description: Global appearance, immutable preset snapshots and uploaded fonts.
  - name: Health
    description: Check API and SQLite readiness without triggering discovery.
  - name: Dashboard
    description: Read selected service and host widgets or change homepage selection.
  - name: Services
    description: Review the catalog, create manual entries, save presentation overrides, and manage pins.
  - name: Discovery
    description: Request a scan of discovery sources configured on this API process.
  - name: Hosts
    description: Read source roots, workload inventory, reporting status, and basic CPU and memory history.
  - name: Federation
    description: Import source-scoped discovery snapshots and telemetry with registered agent credentials.
  - name: Icons
    description: Manage uploaded image assets and their revision digests. Bundled icons are referenced by ID
      through service edits.
  - name: Plugins
    description: Installed plugins, cached connection queries and retained widget configuration.
  - name: Notifications
    description: Source-bound publication and operator management of retained notifications.
externalDocs:
  description: API integration guide and request examples
  url: https://balemoh.araihu.com/reference/api-integration/
