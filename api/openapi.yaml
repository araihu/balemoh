    FederatedCandidate:
      type: object
      required:
        - id
        - source
        - resource
        - displayName
        - description
        - metadata
        - endpoints
        - images
        - observedAt
      properties:
        id:
          type: string
          description: Deterministic SHA-256 of the length-prefixed source and resource identity described on
            this schema.
          example: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
        source:
          $ref: '#/components/schemas/SourceRef'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        displayName:
          type: string
          description: Discovered name before gateway-owned display overrides.
          example: Grafana
        description:
          type: string
          description: Description emitted by the source adapter.
          example: Metrics and dashboards
        metadata:
          type: object
          additionalProperties:
            type: string
          description: String metadata emitted by this source adapter.
          example:
            fixture: synthetic
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
          description: Observed addresses and port evidence to import.
          example:
            - name: https
              url: https://grafana.example.test
              port: 443
              protocol: HTTPS
              provenance: synthetic
        images:
          type: array
          items:
            type: string
          description: Container image references reported by discovery.
          example: []
        observedAt:
          type: string
          format: date-time
          description: UTC time this resource was observed by the source.
          example: '2026-10-25T12:00:00Z'
      description: 'One raw observation in a complete source snapshot. The ID is SHA-256 of the concatenation of
        five length-prefixed UTF-8 strings: source.kind, source.id, resource.kind, resource.namespace or empty,
        and resource.name. Each trimmed string is encoded as its byte length in decimal, then a colon, then its
        bytes. Prefer the agent implementation over constructing IDs by hand. Do not include gateway pin or edit
        state.'
      example:
        id: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
        source:
          kind: container
          id: atlas
        resource:
          kind: container
          name: grafana
        displayName: Grafana
        description: Metrics and dashboards
        metadata:
          fixture: synthetic
        endpoints:
          - name: https
            url: https://grafana.example.test
            port: 443
            protocol: HTTPS
            provenance: synthetic
        images: []
        observedAt: '2026-10-25T12:00:00Z'
    ThemeColor:
      type: object
      additionalProperties: false
      required:
      - space
      - channels
      - alpha
      properties:
        space:
          type: string
          enum:
          - srgb
          - oklch
          example: srgb
        channels:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: sRGB channels 0..1; OKLCH L 0..1, C 0..0.5, hue 0..<360. All finite.
        alpha:
          type: number
          minimum: 0
          maximum: 1
          example: 1
      description: Finite literal color with three channels and explicit alpha. No CSS expressions or palette
        aliases.
    ThemeFontRef:
      type: object
      additionalProperties: false
      required:
      - source
      - id
      properties:
        source:
          type: string
          enum:
          - system
          - google
          - bundled
          - upload
          example: system
        id:
          type: string
          maxLength: 200
          example: stack-58751021b6049b7de349355e
      description: Stable font source and identity. Uploaded IDs reference immutable file bytes.
    ThemeTypography:
      type: object
      additionalProperties: false
      required:
      - title
      - body
      properties:
        title:
          $ref: '#/components/schemas/ThemeFontRef'
        body:
          $ref: '#/components/schemas/ThemeFontRef'
      description: Independent title and body font choices. Variable fonts use default axis values.
    ThemeProvenance:
      type: object
      additionalProperties: false
      required:
      - presetKey
      - goshtosoVersion
      - catalogRevision
      properties:
        presetKey:
          type: string
          example: goshtoso
        goshtosoVersion:
          type: string
          example: catalog:ef0a8c432f910d25d8e9e8b09948fbdac35df0aa5679a7238ed09a2f02738c8b
        catalogRevision:
          type: string
          example: ef0a8c432f910d25d8e9e8b09948fbdac35df0aa5679a7238ed09a2f02738c8b
      description: Origin of a materialized snapshot. These fields establish no live preset inheritance.
    ThemeDefinition:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - tokens
      - typography
      - radiusRem
      - provenance
      properties:
        schemaVersion:
          type: integer
          enum:
          - 1
          example: 1
        tokens:
          type: object
          maxProperties: 256
          additionalProperties:
            $ref: '#/components/schemas/ThemeColor'
          description: Complete installed token registry. Literal values, no CSS or palette inheritance.
        typography:
          $ref: '#/components/schemas/ThemeTypography'
        radiusRem:
          type: number
          minimum: 0
          maximum: 4
          example: 0.5
        provenance:
          $ref: '#/components/schemas/ThemeProvenance'
      x-go-type: themes.Definition
      x-go-type-import:
        path: github.com/araihu/goshtoso/themes
        name: themes
      description: Complete snapshot, at most 64 KiB JSON. Unknown fields and incomplete token sets are rejected.
    ThemeDraft:
      type: object
      additionalProperties: false
      required:
      - name
      - definition
      properties:
        brandLogoId:
          type: string
          maxLength: 200
          example: upload:LOGO
          description: Uploaded logo reference. Omit from a replacement draft to preserve the saved logo; empty restores the Balemoh logo.
        brandIconId:
          type: string
          maxLength: 200
          example: upload:EXAMPLE
          description: Uploaded app icon/favicon. Omit to preserve the saved icon; empty restores the Balemoh icon.
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Ocean
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
      description: Complete named replacement draft. Applied only by an atomic presentation Save.
    PresentationSelection:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        brandLogoId:
          type: string
          maxLength: 200
          example: upload:LOGO
          description: Logo image for newCustom only. Empty selects the Balemoh logo; omitting this field retains the legacy shared icon behavior. Existing custom selections use their saved logo.
        brandIconId:
          type: string
          maxLength: 200
          example: upload:EXAMPLE
          description: Uploaded app icon/favicon for newCustom only. Existing custom selections use their saved branding.
        kind:
          type: string
          enum:
          - builtin
          - custom
          - newCustom
          example: builtin
        key:
          type: string
          example: goshtoso
        id:
          type: string
        expectedCatalogRevision:
          type: string
          example: ef0a8c432f910d25d8e9e8b09948fbdac35df0aa5679a7238ed09a2f02738c8b
        expectedThemeRevision:
          $ref: '#/components/schemas/PresentationRevision'
        name:
          type: string
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
        draft:
          $ref: '#/components/schemas/ThemeDraft'
      description: 'Exactly one form: builtin has key and expectedCatalogRevision; custom has id, expectedThemeRevision,
        optional draft; newCustom has fresh theme:UUID id, name, definition, expectedCatalogRevision. Other
        form fields are rejected. Read responses contain identity only, and expectedThemeRevision for the
        active custom theme.'
    PresentationSettings:
      type: object
      additionalProperties: false
      required:
      - revision
      - colorMode
      - selection
      properties:
        revision:
          $ref: '#/components/schemas/PresentationRevision'
        colorMode:
          type: string
          enum:
          - system
          - light
          - dark
          example: system
        selection:
          $ref: '#/components/schemas/PresentationSelection'
      description: Instance-wide theme identity and color mode with a decimal settings revision.
    PresentationState:
      type: object
      additionalProperties: false
      required:
      - settings
      - catalogRevision
      - definition
      properties:
        brandLogoId:
          type: string
          maxLength: 200
          example: upload:LOGO
          description: Independent logo reference of the active custom theme; omitted when its original Balemoh logo is selected.
        brandIconId:
          type: string
          maxLength: 200
          example: upload:EXAMPLE
          description: App icon/favicon reference of the active custom theme; omitted for the Balemoh default.
        settings:
          example:
            revision: '0'
            colorMode: system
            selection:
              kind: builtin
              key: goshtoso
          allOf:
          - $ref: '#/components/schemas/PresentationSettings'
        catalogRevision:
          type: string
          example: ef0a8c432f910d25d8e9e8b09948fbdac35df0aa5679a7238ed09a2f02738c8b
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
      description: Authoritative settings and the complete currently selected definition. Storage failure
        returns 503, never empty defaults.
    PresentationSave:
      type: object
      additionalProperties: false
      required:
      - commandId
      - expectedSettingsRevision
      - colorMode
      - selection
      properties:
        commandId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        expectedSettingsRevision:
          $ref: '#/components/schemas/PresentationRevision'
        colorMode:
          type: string
          enum:
          - system
          - light
          - dark
          example: dark
        selection:
          $ref: '#/components/schemas/PresentationSelection'
      description: Client-identified atomic Save. Preserve command and resource IDs when retrying an unconfirmed
        response.
    PresentationReceipt:
      type: object
      additionalProperties: false
      required:
      - commandId
      - settings
      properties:
        commandId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        settings:
          example:
            revision: '1'
            colorMode: dark
            selection:
              kind: builtin
              key: goshtoso
          allOf:
          - $ref: '#/components/schemas/PresentationSettings'
        themeRevision:
          $ref: '#/components/schemas/PresentationRevision'
      description: Committed result of a successful Save or its immediate exact replay.
