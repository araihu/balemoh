      operationId: SyncDiscovery
      responses:
        '200':
          description: Discovery synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
              example:
                sources: 1
                candidates: 1
        '503':
          description: Unable to synchronize local discovery sources because required storage or a provider is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Discovery
      summary: Synchronize local discovery sources
      description: |-
        Runs a scan of the discovery sources configured on this API process and returns source and candidate counts. This request does not force remote federated agents to scan. A complete successful source snapshot marks absent observations missing; a failed source scan does not mark its catalog entries missing. Display edits and pin preferences survive synchronization. New candidates remain unpinned.
  /api/v1/federation/snapshots:
    post:
      operationId: ImportFederationSnapshot
      security:
        - FederationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationSnapshot'
            example:
              source:
                kind: container
                id: atlas
              candidates:
                - id: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
                  source:
                    kind: container
                    id: atlas
                  resource:
                    kind: container
                    name: grafana
                  displayName: Grafana
                  description: Metrics and dashboards
                  metadata:
                    fixture: synthetic
                  endpoints:
                    - name: https
                      url: https://grafana.example.test
                      port: 443
                      protocol: HTTPS
                      provenance: synthetic
                  images: []
                  observedAt: '2026-10-25T12:00:00Z'
              observedAt: '2026-10-25T12:00:00Z'
        description: Complete observed candidate set for one source. Never submit an empty set to represent a
          failed scan.
      responses:
        '200':
          description: Federated discovery snapshot imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
              example:
                sources: 1
                candidates: 1
        '400':
          description: Snapshot is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_snapshot
                message: invalid federation snapshot
        '413':
          description: Snapshot exceeds the maximum accepted payload size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: payload_too_large
                message: federation snapshot exceeds the maximum size
        '401':
          description: Federation credentials are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unauthorized
                message: invalid federation credentials
        '403':
          description: Source is not registered at this gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: source_not_registered
                message: federation source is not registered
        '404':
          description: Federation ingestion is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: federation_disabled
                message: federation ingestion is not enabled
        '503':
          description: Unable to import a complete discovery snapshot because required storage or a provider
            is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Federation
      summary: Import a complete discovery snapshot
      description: |-
        Replaces observations for one registered source using its source-bound Bearer credential. Every candidate must carry that same source and a valid deterministic ID. candidates is the complete source snapshot: an empty array marks its prior observations missing. Older or repeated snapshots do not replace newer catalog state. The gateway retains its own edits and pins. The request is limited to 2 MiB. A disabled snapshot importer returns 404. Replace the example timestamps with current UTC before sending.
  /api/v1/staging/services/{serviceId}/lifecycle:
    post:
      operationId: changeServiceLifecycle
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
          description: Current catalog group to hide, show, or purge. Re-read Staging if its state has
            changed.
          example: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [hide, show, purge]
                  description: hide suppresses a live service, show restores visibility, and purge permanently
                    deletes only missing observations.
                  example: hide
              example:
                action: hide
            example:
              action: hide
        description: One lifecycle action evaluated against current catalog state.
      responses:
        '204':
          description: Visibility changed or missing resource permanently deleted
        '400':
          description: The lifecycle action is absent, unknown, or malformed JSON.
          content:
            text/plain:
              schema:
                type: string
                example: "Invalid action\n"
              example: "Invalid action\n"
        '404':
          description: The catalog group no longer exists for the request to hide, restore, or purge a service
            group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: not_found
                message: service candidate not found
        '409':
          description: Current catalog state does not allow this request to hide, restore, or purge a service
            group; refresh Staging before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: conflict
                message: Service state changed. Refresh before trying again.
        '503':
          description: Unable to hide, restore, or purge a service group because required storage or a
            provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Services
      summary: Hide, restore, or purge a service group
      description: |-
        hide suppresses a live group while preserving its settings and pin choice; repeated hide is allowed. show restores a hidden group to live or missing according to discovery presence. purge permanently removes only missing observations and their saved edits, endpoints, and pins; still-live shared observations and uploaded icon files remain. A rediscovered purged service starts with discovery defaults. Current state is checked in the write transaction; refresh after 409 instead of blindly retrying. This changes the catalog only and never stops workloads.
