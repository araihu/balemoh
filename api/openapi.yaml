openapi: 3.0.3
info:
  title: Balemoh API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: GetHealthz
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services:
    get:
      operationId: GetStagingServices
      responses:
        '200':
          description: Discovered service candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: EditStagingService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEdit'
      responses:
        '204':
          description: Local presentation saved, independently of discovery
        '400':
          description: Invalid edit
        '404':
          description: Service not found
        '503':
          description: Catalog unavailable
  /api/v1/staging/services/{serviceId}/pin:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: PinStagingService
      responses:
        '200':
          description: Updated pinned service candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '404':
          description: Candidate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: UnpinStagingService
      responses:
        '200':
          description: Updated unpinned service candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '404':
          description: Candidate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/homepage/services:
    get:
      operationId: GetHomepageServices
      responses:
        '200':
          description: Pinned homepage services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/discovery/sync:
    post:
      operationId: SyncDiscovery
      responses:
        '200':
          description: Discovery synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
        '503':
          description: Discovery synchronization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/federation/snapshots:
    post:
      operationId: ImportFederationSnapshot
      security:
        - FederationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationSnapshot'
      responses:
        '200':
          description: Federated discovery snapshot imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
        '400':
          description: Snapshot is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Snapshot exceeds the maximum accepted payload size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Federation credentials are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source is not registered at this gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Federation ingestion is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Snapshot could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services/{serviceId}/lifecycle:
    post:
      operationId: changeServiceLifecycle
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [hide, show, purge]
      responses:
        '204':
          description: Visibility changed or missing resource permanently deleted
        '400':
          description: Invalid action
        '404':
          description: Resource no longer exists
        '409':
          description: Current resource state does not permit this action
        '503':
          description: Catalog unavailable
  /api/v1/icons:
    get:
      operationId: listIcons
      responses:
        '200':
          description: Uploaded icons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadedIcon'
    post:
      operationId: uploadIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '201':
          description: Icon stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
        '400':
          description: Invalid image
  /api/v1/icons/{iconID}:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '200':
          description: Icon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
        '400':
          description: Invalid image
        '404':
          description: Missing icon
        '409':
          description: Icon changed since it was opened
    delete:
      operationId: deleteIcon
      parameters:
        - name: digest
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unused icon deleted
        '409':
          description: Icon in use or changed
  /api/v1/icons/{iconID}/image:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIconImage
      responses:
        '200':
          description: Validated image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Missing icon

components:
  securitySchemes:
    FederationBearer:
      type: http
      scheme: bearer
  schemas:
    UploadedIcon:
      type: object
      required: [id, name, tags, mime, digest, usedBy]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: string
        mime:
          type: string
        digest:
          type: string
        usedBy:
          type: array
          items:
            type: string
    IconUpload:
      type: object
      additionalProperties: false
      required: [name, tags]
      properties:
        name:
          type: string
          maxLength: 200
        tags:
          type: string
          maxLength: 1000
        data:
          type: string
          format: byte
          description: Base64 image bytes. Omit to keep existing image.
        digest:
          type: string
          description: Existing image revision required for updates.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    SourceRef:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
        id:
          type: string
    ResourceRef:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
    ServiceEndpoint:
      type: object
      required:
        - name
        - url
        - port
        - protocol
        - provenance
      properties:
        name:
          type: string
        url:
          type: string
          description: Empty when discovery has no exact hostname or route; HTTPRoute observations may be scheme-relative.
        port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          description: Zero when no port was observed.
        protocol:
          type: string
        provenance:
          type: string
          description: Adapter evidence for the endpoint observation.
    ResourceObservation:
      type: object
      required: [resource, endpoints, images]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          items:
            type: string
    ServiceEdit:
      type: object
      additionalProperties: false
      required: [displayName, description, address]
      properties:
        icon:
          type: string
          maxLength: 256
          description: Icon reference. Empty resets to discovery; omitted preserves selection.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        address:
          type: string
          maxLength: 2048
          description: Absolute HTTP(S) homepage address; empty uses discovery
    ServiceCandidate:
      type: object
      required:
        - status
        - missing
        - id
        - source
        - resource
        - displayName
        - description
        - metadata
        - endpoints
        - images
        - observedAt
        - pinned
        - pinnedAt
      properties:
        status:
          type: string
          enum: [live, missing, hidden]
          description: Hidden takes precedence over missing until the user shows the service again.
        missing:
          type: boolean
          description: Absent from the latest successful source snapshot, including when hidden.
        icon:
          type: string
          description: Local icon reference; empty uses discovery.
        address:
          type: string
          description: Local homepage address override; empty uses discovery
        resources:
          type: array
          description: Resource evidence grouped under this Service; pin identity remains the Service ID.
          items:
            $ref: '#/components/schemas/ResourceObservation'
        id:
          type: string
        source:
          $ref: '#/components/schemas/SourceRef'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        displayName:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          description: Container images observed for the candidate, when available.
          items:
            type: string
        observedAt:
          type: string
          format: date-time
        pinned:
          type: boolean
        pinnedAt:
          type: string
          format: date-time
          nullable: true
    ServiceListResponse:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCandidate'
    DiscoverySyncResponse:
      type: object
      required:
        - sources
        - candidates
      properties:
        sources:
          type: integer
          format: int32
          minimum: 0
        candidates:
          type: integer
          format: int32
          minimum: 0
    FederationSnapshot:
      type: object
      required:
        - source
        - candidates
        - observedAt
      properties:
        source:
          $ref: '#/components/schemas/SourceRef'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FederatedCandidate'
        observedAt:
          type: string
          format: date-time
    FederatedCandidate:
      type: object
      required:
        - id
        - source
        - resource
        - displayName
        - description
        - metadata
        - endpoints
        - images
        - observedAt
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/SourceRef'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        displayName:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          items:
            type: string
        observedAt:
          type: string
          format: date-time
