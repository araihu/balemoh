                type: string
                example: "invalid telemetry body\n"
              example: "invalid telemetry body\n"
        '401':
          description: Missing or incorrect telemetry source credential.
          content:
            text/plain:
              schema:
                type: string
                example: "source not authorized\n"
              example: "source not authorized\n"
        '403':
          description: This telemetry source is not registered at the gateway.
          content:
            text/plain:
              schema:
                type: string
