      description: Returns one consistent settings revision and selected snapshot. Empty initialization
        is Goshtoso/System at revision 0. Storage or unsupported saved-definition errors return 503 without
        resetting data.
    put:
      operationId: SavePresentation
      tags:
      - Presentation
      summary: Atomically save and activate presentation
      responses:
        '200':
          description: Committed global selection and command receipt, or the same receipt on an immediate
            exact replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationReceipt'
              example:
                commandId: 11111111-1111-4111-8111-111111111111
                settings:
                  revision: '1'
                  colorMode: dark
                  selection:
                    kind: builtin
                    key: goshtoso
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationSave'
            example:
              commandId: 11111111-1111-4111-8111-111111111111
              expectedSettingsRevision: '0'
              colorMode: dark
              selection:
                kind: builtin
                key: goshtoso
                expectedCatalogRevision: ef0a8c432f910d25d8e9e8b09948fbdac35df0aa5679a7238ed09a2f02738c8b
        description: Atomic Save command with expected settings and selection revisions.
      description: Checks settings, theme and catalog revisions, validates references and commits one transaction.
        Immediate identical command replay returns its receipt. Reusing a command ID with different content
        conflicts. After another Save, stale commands conflict. Never force or silently rebase.
