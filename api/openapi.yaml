        description: New trimmed display name and the current expected theme revision.
      description: Checks expectedRevision and changes only the trimmed display name. Increments the theme
        revision without changing global selection or font references. Stale requests return 409.
    delete:
      operationId: DeleteTheme
      tags:
      - Presentation
      summary: Delete an inactive theme
      responses:
        '204':
          description: Inactive theme and its reference rows removed. Uploaded files preserved.
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
      parameters:
      - $ref: '#/components/parameters/PresentationExpectedRevision'
      description: Checks expectedRevision and rejects the active custom theme with 409 in_use. Deleting
        an inactive theme removes its reference rows without deleting font files or selecting a fallback.
  /api/v1/fonts:
    get:
      operationId: ListFonts
      tags:
      - Presentation
      summary: List uploaded font metadata without file bytes
      responses:
        '200':
          description: Uploaded file metadata and current referencing themes. File bytes are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadedFont'
              example:
              - id: font:11111111-1111-4111-8111-111111111111
                name: Go Regular
                family: Go
                weight: '400'
                style: normal
                variable: false
                format: truetype
                mime: font/ttf
                byteLength: 148672
                digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                revision: '1'
                usedBy: []
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
      description: Returns uploaded file metadata and saved-theme references, without BLOBs. Empty uploads
        return an empty array. System, Google and packaged choices belong to the public Goshtoso catalog.
    post:
      operationId: UploadFont
      tags:
      - Presentation
      summary: Upload a new immutable font reference
      responses:
        '201':
          description: Validated original file and derived metadata committed under a new font identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFont'
              example:
                id: font:11111111-1111-4111-8111-111111111111
                name: Go Regular
                family: Go
                weight: '400'
                style: normal
                variable: false
                format: truetype
                mime: font/ttf
                byteLength: 148672
                digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                revision: '1'
                usedBy: []
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
        '200':
          description: Exact immutable upload replay recognized. Existing bytes and metadata retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFont'
              example:
                id: font:11111111-1111-4111-8111-111111111111
                name: Go Regular
                family: Go
                weight: '400'
                style: normal
                variable: false
                format: truetype
                mime: font/ttf
                byteLength: 148672
                digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                revision: '1'
                usedBy: []
        '413':
          $ref: '#/components/responses/PresentationTooLarge'
        '415':
          $ref: '#/components/responses/PresentationUnsupportedFont'
      description: WOFF2, WOFF, TTF, OTF including variable fonts at default axes. Raw file <=10 MiB. Multipart
        total <=10 MiB +64 KiB. At most 256 files and 512 MiB total. Metadata is derived from bounded container
        inspection. Every deliberate upload uses a new font:UUID; exact same-ID replay is idempotent. No
        replacement.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - id
              - name
              - file
              properties:
                id:
                  type: string
                  example: font:11111111-1111-4111-8111-111111111111
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Go Regular
                file:
                  type: string
                  format: binary
                  example: <original font file bytes>
            example:
              id: font:11111111-1111-4111-8111-111111111111
              name: Go Regular
              file: <original font file bytes>
        description: Client-generated font:UUID, display name, and one original font file. Metadata comes
          from file contents.
  /api/v1/fonts/{fontID}:
    parameters:
    - $ref: '#/components/parameters/PresentationFontID'
    delete:
      operationId: DeleteFont
      tags:
      - Presentation
      summary: Delete an uploaded font with no saved references
      responses:
        '204':
          description: Unreferenced uploaded font bytes and metadata removed.
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
      parameters:
      - $ref: '#/components/parameters/PresentationExpectedRevision'
      description: Checks the immutable font revision and rejects references from any saved theme with 409
        in_use and usedBy. No referenced bytes are replaced or removed.
  /api/v1/fonts/{fontID}/file:
    parameters:
    - $ref: '#/components/parameters/PresentationFontID'
    get:
      operationId: GetFontFile
      tags:
      - Presentation
      summary: Read original immutable font bytes
      responses:
        '200':
          description: Immutable original bytes; private cache and ETag
          content:
            font/woff2:
              schema:
                type: string
                format: binary
            font/woff:
              schema:
                type: string
                format: binary
            font/ttf:
              schema:
                type: string
                format: binary
            font/otf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/PresentationInvalid'
        '404':
          $ref: '#/components/responses/PresentationMissing'
        '409':
          $ref: '#/components/responses/PresentationRejected'
        '503':
          $ref: '#/components/responses/PresentationUnavailable'
        '304':
          description: Not modified
      description: Returns original uploaded font bytes with validated media type, quoted digest ETag and
        private, max-age=0, must-revalidate caching. If-None-Match may produce 304. Missing or deleted references
        return the JSON error envelope.
components:
  securitySchemes:
    PluginService:
      type: http
      scheme: bearer
      description: Private BFF service credential for plugin metadata, queries and retained widget configuration.
    FederationBearer:
      type: http
      scheme: bearer
      description: 'Source-bound agent credential. Send Authorization: Bearer <token>. The body source.kind and
        source.id must match the source registered for that credential. This scheme applies only to the two federation
        ingestion endpoints.'
    NotificationOperator:
      type: http
      scheme: bearer
      description: Private operator credential for listing, reading, marking and clearing the retained inbox. It
        cannot publish messages.
    NotificationPublisher:
      type: http
      scheme: bearer
      description: Configured source-bound credential for external publication only. It cannot list, mark or clear
        messages.
  responses:
    PresentationInvalid:
      description: Malformed command, unsupported values, unknown fields, or a missing required revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: Invalid presentation request.
    PresentationMissing:
      description: The requested custom theme or uploaded font does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: Resource not found.
    PresentationRejected:
      description: Optimistic conflict, reused identity with different content, item in use, or a catalog/storage
        quota. Saved state is preserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: conflict
            message: Saved state changed. Preserve the draft and inspect the saved version.
    PresentationTooLarge:
      description: Raw upload, multipart request, declared decoded size, or actual decoded output exceeds
        the documented bound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: upload_too_large
            message: Font exceeds upload or decoded-data limits.
    PresentationUnsupportedFont:
      description: Unsupported font container. Collections and EOT files are excluded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unsupported_font
            message: Use a single WOFF2, WOFF, TTF, or OTF font.
    PresentationUnavailable:
      description: Required storage or catalog could not be read or committed. No synthetic empty state
        is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unavailable
            message: Presentation storage or catalog unavailable.
  parameters:
    PresentationThemeID:
      name: themeID
      in: path
      required: true
      description: Stable theme:UUID returned by the custom-theme catalog.
      schema:
        type: string
    PresentationFontID:
      name: fontID
      in: path
      required: true
      description: Immutable font:UUID returned by an upload or the uploaded-font catalog.
      schema:
        type: string
    PresentationExpectedRevision:
      name: expectedRevision
      in: query
      required: true
      description: Exact current revision of the item being deleted. A stale value returns 409.
      schema:
        $ref: '#/components/schemas/PresentationRevision'
  schemas:
    PluginPlacementBody:
      type: object
      additionalProperties: false
      required:
      - pluginId
      - connectionId
      - contributionId
      - options
      - enabled
      properties:
        pluginId:
          type: string
          example: example.status
        connectionId:
          type: string
          example: 00000000-0000-4000-8000-000000000001
        contributionId:
          type: string
          example: summary
        options:
          type: object
          additionalProperties: true
          example: {}
        enabled:
          type: boolean
          example: true
      description: Selected plugin connection, widget contribution, saved options and enabled state.
      example:
        pluginId: example.status
        connectionId: 00000000-0000-4000-8000-000000000001
        contributionId: summary
        options: {}
        enabled: true
    PluginPlacement:
      type: object
      additionalProperties: false
      required:
      - pluginId
      - connectionId
      - contributionId
      - options
      - enabled
      - placementId
      - revision
      - createdAt
      - updatedAt
      properties:
        pluginId:
          type: string
          example: example.status
        connectionId:
          type: string
          example: 00000000-0000-4000-8000-000000000001
        contributionId:
          type: string
          example: summary
        options:
          type: object
          additionalProperties: true
          example: {}
        enabled:
          type: boolean
          example: true
        placementId:
          type: string
          example: 00000000-0000-4000-8000-000000000002
        revision:
          type: string
          pattern: ^[1-9][0-9]*$
          example: '1'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-26T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-26T12:00:00Z'
      description: Retained widget configuration with its optimistic concurrency revision and persistence timestamps.
      example:
        pluginId: example.status
        connectionId: 00000000-0000-4000-8000-000000000001
        contributionId: summary
        options: {}
        enabled: true
        placementId: 00000000-0000-4000-8000-000000000002
        revision: '1'
        createdAt: '2026-10-26T12:00:00Z'
        updatedAt: '2026-10-26T12:00:00Z'
    PluginWidgetDefinition:
      type: object
      required:
      - pluginId
      - contributionId
      - title
      - optionsSchema
      properties:
        pluginId:
          type: string
          example: example.status
        contributionId:
          type: string
          example: summary
        title:
          type: string
          example: Example summary
        optionsSchema:
          type: object
          additionalProperties: true
          example:
            type: object
            properties: {}
            additionalProperties: false
      description: Installed widget contribution and its JSON Schema for user-configurable options.
      example:
        pluginId: example.status
        contributionId: summary
        title: Example summary
        optionsSchema:
          type: object
          properties: {}
          additionalProperties: false
    PluginCatalog:
      type: object
      additionalProperties: false
      required:
      - plugins
      - problems
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginDescriptor'
          example: []
        problems:
          type: array
          items:
            $ref: '#/components/schemas/PluginInstallationProblem'
          example: []
      description: Installed plugin descriptors and safe installation failures, without executable paths or credentials.
      example:
        plugins: []
        problems: []
    PluginInstallationProblem:
      type: object
      additionalProperties: false
      required:
      - installationId
      - error
      properties:
        installationId:
          type: string
          example: example-installation
        pluginId:
          type: string
          example: example.status
        connectionKey:
          type: string
          example: primary
        error:
          $ref: '#/components/schemas/PluginFailure'
      description: Installation identity and safe failure details when a configured package cannot become available.
      example:
        installationId: example-installation
        pluginId: example.status
        connectionKey: primary
        error:
          code: unavailable
          message: Source unavailable
          retryable: true
    PluginDescriptor:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - manifestDigest
      - connections
      properties:
        id:
          type: string
          example: example.status
        version:
          type: string
          example: 0.1.0
        manifestDigest:
          type: string
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        connections:
          type: array
          items:
            $ref: '#/components/schemas/PluginConnection'
          example:
          - id: 00000000-0000-4000-8000-000000000001
            key: primary
            name: Example source
            revision: '1'
            enabled: true
            ready: true
            state: fresh
            appliedRevision: '1'
            observationRevision: '1'
            observedAt: '2026-10-26T12:00:00Z'
            lastAttemptAt: '2026-10-26T12:00:00Z'
            lastSuccessAt: '2026-10-26T12:00:00Z'
            lastConfigureAttemptAt: '2026-10-26T12:00:00Z'
            queries:
            - list
      description: Installed plugin version, verified manifest digest and configured connection descriptors.
      example:
        id: example.status
        version: 0.1.0
        manifestDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        connections:
        - id: 00000000-0000-4000-8000-000000000001
          key: primary
          name: Example source
          revision: '1'
          enabled: true
          ready: true
          state: fresh
          appliedRevision: '1'
          observationRevision: '1'
          observedAt: '2026-10-26T12:00:00Z'
          lastAttemptAt: '2026-10-26T12:00:00Z'
          lastSuccessAt: '2026-10-26T12:00:00Z'
          lastConfigureAttemptAt: '2026-10-26T12:00:00Z'
          queries:
          - list
    PluginConnection:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - name
      - revision
      - enabled
      - ready
      - state
      - appliedRevision
      - observationRevision
      - observedAt
      - lastAttemptAt
      - lastSuccessAt
      - lastConfigureAttemptAt
      - queries
      properties:
        id:
          type: string
          example: 00000000-0000-4000-8000-000000000001
        key:
          type: string
          example: primary
        name:
          type: string
          example: Example source
        revision:
          type: string
          example: '1'
        enabled:
          type: boolean
          example: true
        ready:
          type: boolean
          example: true
        state:
          type: string
          enum:
          - fresh
          - partial
          - stale
          - unavailable
          example: fresh
        appliedRevision:
          type: string
          nullable: true
          example: '1'
        observationRevision:
          type: string
          nullable: true
          example: '1'
        observedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        lastConfigureAttemptAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        sourceError:
          $ref: '#/components/schemas/PluginFailure'
        configurationError:
          $ref: '#/components/schemas/PluginFailure'
        queries:
          type: array
          items:
            type: string
          example:
          - list
      description: Connection identity, applied configuration revision, collection state and available query identifiers.
      example:
        id: 00000000-0000-4000-8000-000000000001
        key: primary
        name: Example source
        revision: '1'
        enabled: true
        ready: true
        state: fresh
        appliedRevision: '1'
        observationRevision: '1'
        observedAt: '2026-10-26T12:00:00Z'
        lastAttemptAt: '2026-10-26T12:00:00Z'
        lastSuccessAt: '2026-10-26T12:00:00Z'
        lastConfigureAttemptAt: '2026-10-26T12:00:00Z'
        queries:
        - list
    PluginFailure:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          example: unavailable
        message:
          type: string
          example: Source unavailable
        retryable:
          type: boolean
          example: true
      description: Safe error code and message, with a retryability hint and no source credentials.
      example:
        code: unavailable
        message: Source unavailable
        retryable: true
    PluginQueryResult:
      type: object
      additionalProperties: false
      required:
      - data
      - state
      - observationRevision
      - observedAt
      - lastSuccessAt
      properties:
        data:
          type: object
          additionalProperties: true
          example:
            count: 2
        state:
          type: string
          enum:
          - fresh
          - partial
          - stale
          - unavailable
          example: fresh
        observationRevision:
          type: string
          example: '1'
        observedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-26T12:00:00Z'
        sourceError:
          $ref: '#/components/schemas/PluginFailure'
      description: Cached query data with collection freshness, observation identity and source failure metadata.
      example:
        data:
          count: 2
        state: fresh
        observationRevision: '1'
        observedAt: '2026-10-26T12:00:00Z'
        lastSuccessAt: '2026-10-26T12:00:00Z'
