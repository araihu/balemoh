openapi: 3.0.3
info:
  title: Balemoh API
  version: 0.1.0
paths:
  /api/v1/plugin-widgets:
    get:
      operationId: GetPluginWidgets
      security: [{PluginService: []}]
      responses:
        '200':
          description: Widget definitions and retained placements
          content:
            application/json:
              schema:
                type: object
                required: [definitions, placements]
                properties:
                  definitions: {type: array, items: {$ref: '#/components/schemas/PluginWidgetDefinition'}}
                  placements: {type: array, items: {$ref: '#/components/schemas/PluginPlacement'}}
        '401': {description: Missing private credential}
        '503': {description: Metadata unavailable}
  /api/v1/plugin-widgets/{placementId}:
    parameters:
      - {name: placementId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: PutPluginWidget
      security: [{PluginService: []}]
      parameters:
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPlacementBody'}
      responses:
        '201':
          description: Placement created
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginPlacement'}
        '200':
          description: Identical create replay or updated placement
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginPlacement'}
        '400': {description: Invalid body or options}
        '401': {description: Missing private credential}
        '404': {description: Connection or definition missing}
        '409': {description: Create identity conflict or capacity reached}
        '412': {description: Stale revision}
        '428': {description: Required revision missing}
    delete:
      operationId: DeletePluginWidget
      security: [{PluginService: []}]
      parameters:
        - {name: If-Match, in: header, schema: {type: string}}
      responses:
        '204': {description: Configuration removed, source data untouched}
        '401': {description: Missing private credential}
        '404': {description: Placement absent}
        '412': {description: Stale revision}
        '428': {description: Required revision missing}
  /api/v1/plugins:
    get:
      operationId: GetPlugins
      security: [{PluginService: []}]
      responses:
        '200':
          description: Data-only plugin descriptors, without deployment paths or credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginCatalog'}
        '401':
          description: Missing or invalid private BFF service credential
        '503':
          description: Plugin metadata unavailable
  /api/v1/plugins/{pluginId}/connections/{connectionId}/queries/{queryId}:
    post:
      operationId: QueryPlugin
      security: [{PluginService: []}]
      parameters:
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: connectionId, in: path, required: true, schema: {type: string}}
        - {name: queryId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              additionalProperties: false
              properties:
                input: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Validated cached observation; never performs collection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginQueryResult'}
        '400': {description: Invalid query input}
        '401': {description: Missing or invalid private BFF service credential}
        '403': {description: Connection disabled or operation not granted}
        '404': {description: Unknown plugin, connection or operation}
        '409': {description: Observation revision changed}
        '413': {description: Query input exceeds limit}
        '429': {description: Plugin query capacity exceeded}
        '502': {description: Invalid plugin output}
        '503': {description: Plugin or source observation unavailable}
        '504': {description: Plugin query deadline exceeded}
  /api/v1/dashboard:
    get:
      operationId: GetDashboard
      responses:
        '200':
          description: Selected widgets and unavailable source providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
        '503':
          description: Dashboard unavailable

  /api/v1/notifications:
    delete:
      operationId: ClearNotifications
      description: Permanently remove all stored notifications, read and unread, across sources and pages. This also resets their deduplication identities. Messages committed after the clear statement remain. No source alerts are changed.
      security:
        - NotificationOperator: []
      responses:
        '204': {description: Inbox cleared, including an already empty inbox}
        '401': {description: Missing or invalid operator credential}
        '503': {description: Notification storage unavailable}
    get:
      operationId: GetNotifications
      security:
        - NotificationOperator: []
      parameters:
        - {name: before, in: query, required: false, schema: {type: string}}
        - {name: unread, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: One stable inbox page and unread total
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '400': {description: Invalid cursor or page options}
        '401': {description: Missing or invalid operator credential}
        '503': {description: Notification storage unavailable}
    post:
      operationId: PublishNotification
      security:
        - NotificationPublisher: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPublishRequest'}
      responses:
        '201':
          description: New notification durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationReceipt'}
        '200':
          description: Identical event replay acknowledged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationReceipt'}
        '400': {description: Invalid notification envelope}
        '401': {description: Missing or invalid publisher credential}
        '409': {description: Event identity conflicts with immutable content}
        '413': {description: Request body exceeds 16 KiB}
        '429': {description: Producer concurrency or inbox capacity exceeded}
        '503': {description: Notification storage unavailable}

  /api/v1/notifications/{notificationId}/read:
    parameters:
      - {name: notificationId, in: path, required: true, schema: {type: string}}
    put:
      operationId: MarkNotificationRead
      security:
        - NotificationOperator: []
      responses:
        '204': {description: Notification marked read, including an idempotent replay}
        '401': {description: Missing or invalid operator credential}
        '404': {description: Notification was not found}
        '503': {description: Notification storage unavailable}

  /api/v1/notifications/{notificationId}:
    parameters:
      - {name: notificationId, in: path, required: true, schema: {type: string}}
    get:
      operationId: GetNotification
      security:
        - NotificationOperator: []
      responses:
        '200':
          description: One notification without changing its read state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '401': {description: Missing or invalid operator credential}
        '404': {description: Notification was not found}
        '503': {description: Notification storage unavailable}
  /api/v1/dashboard/widgets/{sourceKind}/{sourceId}:
    put:
      operationId: SetDashboardSelection
      parameters:
        - {name: sourceKind, in: path, required: true, schema: {type: string}}
        - {name: sourceId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: {type: boolean}
      responses:
        '204':
          description: Desired selection saved, including repeated requests
        '400':
          description: Invalid source or desired state
        '404':
          description: Source identity not found
        '409':
          description: Selection limit reached or source state changed
        '503':
          description: Selection unavailable
  /api/v1/hosts:
    get:
      operationId: GetHosts
      responses:
        '200':
          description: Registered and discovered source roots
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
        '503':
          description: Inventory unavailable
  /api/v1/hosts/{hostId}:
    get:
      operationId: GetHost
      parameters:
        - name: hostId
          in: path
          required: true
          schema: {type: string}
        - name: range
          in: query
          schema: {type: string, enum: [1h, 24h], default: 1h}
      responses:
        '200':
          description: Host detail with one-minute samples and explicit null gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDetail'
        '400':
          description: Invalid range
        '404':
          description: Host not found
        '503':
          description: Inventory unavailable
  /api/v1/federation/telemetry:
    post:
      operationId: ImportTelemetry
      security:
        - FederationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '204':
          description: Accepted, including an already processed observation
        '400':
          description: Invalid telemetry
        '401':
          description: Missing or invalid source credential
        '403':
          description: Source is not registered for this credential
        '413':
          description: Body exceeds 2 MiB
        '503':
          description: Telemetry storage unavailable
  /healthz:
    get:
      operationId: GetHealthz
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services:
    post:
      operationId: CreateManualService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualServiceCreate'
      responses:
        '201':
          description: Manual service created, or current record returned for a repeated requestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '400':
          description: Invalid name, address, icon or requestId
        '503':
          description: Catalog unavailable
    get:
      operationId: GetStagingServices
      responses:
        '200':
          description: Discovered service candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: EditStagingService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEdit'
      responses:
        '204':
          description: Local presentation saved, independently of discovery
        '400':
          description: Invalid edit
        '404':
          description: Service not found
        '503':
          description: Catalog unavailable
  /api/v1/staging/services/{serviceId}/pin:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: PinStagingService
      responses:
        '200':
          description: Updated pinned service candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '404':
          description: Candidate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: UnpinStagingService
      responses:
        '200':
          description: Updated unpinned service candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCandidate'
        '404':
          description: Candidate was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/homepage/services:
    get:
      operationId: GetHomepageServices
      responses:
        '200':
          description: Pinned homepage services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '503':
          description: Catalog is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/discovery/sync:
    post:
      operationId: SyncDiscovery
      responses:
        '200':
          description: Discovery synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
        '503':
          description: Discovery synchronization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/federation/snapshots:
    post:
      operationId: ImportFederationSnapshot
      security:
        - FederationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationSnapshot'
      responses:
        '200':
          description: Federated discovery snapshot imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySyncResponse'
        '400':
          description: Snapshot is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Snapshot exceeds the maximum accepted payload size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Federation credentials are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source is not registered at this gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Federation ingestion is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Snapshot could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/staging/services/{serviceId}/lifecycle:
    post:
      operationId: changeServiceLifecycle
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [hide, show, purge]
      responses:
        '204':
          description: Visibility changed or missing resource permanently deleted
        '400':
          description: Invalid action
        '404':
          description: Resource no longer exists
        '409':
          description: Current resource state does not permit this action
        '503':
          description: Catalog unavailable
  /api/v1/icons:
    get:
      operationId: listIcons
      responses:
        '200':
          description: Uploaded icons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadedIcon'
    post:
      operationId: uploadIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '201':
          description: Icon stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
        '400':
          description: Invalid image
  /api/v1/icons/{iconID}:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpload'
      responses:
        '200':
          description: Icon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
        '400':
          description: Invalid image
        '404':
          description: Missing icon
        '409':
          description: Icon changed since it was opened
    delete:
      operationId: deleteIcon
      parameters:
        - name: digest
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unused icon deleted
        '409':
          description: Icon in use or changed
  /api/v1/icons/{iconID}/image:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIconImage
      responses:
        '200':
          description: Validated image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Missing icon

components:
  securitySchemes:
    PluginService:
      type: http
      scheme: bearer
    FederationBearer:
      type: http
      scheme: bearer
    NotificationOperator:
      type: http
      scheme: bearer
    NotificationPublisher:
      type: http
      scheme: bearer
  schemas:
    PluginPlacementBody:
      type: object
      additionalProperties: false
      required: [pluginId, connectionId, contributionId, options, enabled]
      properties:
        pluginId: {type: string}
        connectionId: {type: string}
        contributionId: {type: string}
        options: {type: object, additionalProperties: true}
        enabled: {type: boolean}
    PluginPlacement:
      allOf:
        - {$ref: '#/components/schemas/PluginPlacementBody'}
        - type: object
          required: [placementId, revision, createdAt, updatedAt]
          properties:
            placementId: {type: string}
            revision: {type: string, pattern: '^[1-9][0-9]*$'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    PluginWidgetDefinition:
      type: object
      required: [pluginId, contributionId, title, optionsSchema]
      properties:
        pluginId: {type: string}
        contributionId: {type: string}
        title: {type: string}
        optionsSchema: {type: object, additionalProperties: true}
    PluginCatalog:
      type: object
      additionalProperties: false
      required: [plugins, problems]
      properties:
        plugins:
          type: array
          items: {$ref: '#/components/schemas/PluginDescriptor'}
        problems:
          type: array
          items: {$ref: '#/components/schemas/PluginInstallationProblem'}
    PluginInstallationProblem:
      type: object
      additionalProperties: false
      required: [installationId, error]
      properties:
        installationId: {type: string}
        pluginId: {type: string}
        connectionKey: {type: string}
        error: {$ref: '#/components/schemas/PluginFailure'}
    PluginDescriptor:
      type: object
      additionalProperties: false
      required: [id, version, manifestDigest, connections]
      properties:
        id: {type: string}
        version: {type: string}
        manifestDigest: {type: string}
        connections:
          type: array
          items: {$ref: '#/components/schemas/PluginConnection'}
    PluginConnection:
      type: object
      additionalProperties: false
      required: [id, key, name, revision, enabled, ready, state, appliedRevision, observationRevision, observedAt, lastAttemptAt, lastSuccessAt, lastConfigureAttemptAt, queries]
      properties:
        id: {type: string}
        key: {type: string}
        name: {type: string}
        revision: {type: string}
        enabled: {type: boolean}
        ready: {type: boolean}
        state: {type: string, enum: [fresh, partial, stale, unavailable]}
        appliedRevision: {type: string, nullable: true}
        observationRevision: {type: string, nullable: true}
        observedAt: {type: string, format: date-time, nullable: true}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
        lastConfigureAttemptAt: {type: string, format: date-time, nullable: true}
        sourceError: {$ref: '#/components/schemas/PluginFailure'}
        configurationError: {$ref: '#/components/schemas/PluginFailure'}
        queries: {type: array, items: {type: string}}
    PluginFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
    PluginQueryResult:
      type: object
      additionalProperties: false
      required: [data, state, observationRevision, observedAt, lastSuccessAt]
      properties:
        data: {type: object, additionalProperties: true}
        state: {type: string, enum: [fresh, partial, stale, unavailable]}
        observationRevision: {type: string}
        observedAt: {type: string, format: date-time, nullable: true}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        sourceError: {$ref: '#/components/schemas/PluginFailure'}
    DashboardSnapshot:
      type: object
      required: [items, unavailable]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DashboardWidget'}
        unavailable:
          type: array
          items: {type: string}
    DashboardWidget:
      type: object
      required: [id, kind, presentation, sourceKind, sourceId, title, data, error]
      properties:
        id: {type: string}
        kind: {type: string}
        presentation: {type: string}
        sourceKind: {type: string}
        sourceId: {type: string}
        title: {type: string}
        data:
          type: object
          additionalProperties: true
        error: {type: string}
    HostMetrics:
      type: object
      required: [cpuPercent, memoryUsedBytes, memoryTotalBytes]
      properties:
        cpuPercent: {type: number, format: double, nullable: true, minimum: 0, maximum: 100}
        memoryUsedBytes: {type: integer, format: int64, nullable: true, minimum: 0}
        memoryTotalBytes: {type: integer, format: int64, nullable: true, minimum: 1}
    HostWorkload:
      type: object
      required: [name, namespace, state, restarts]
      properties:
        name: {type: string, minLength: 1, maxLength: 253}
        namespace: {type: string, maxLength: 253}
        state: {type: string, minLength: 1, maxLength: 64}
        restarts: {type: integer, minimum: 0}
    HostObservation:
      allOf:
        - $ref: '#/components/schemas/HostMetrics'
        - type: object
          required: [node, workloads, inventoryAvailable, ready]
          properties:
            inventoryAvailable: {type: boolean}
            ready: {type: string}
            architecture:
              type: string
              maxLength: 64
              description: CPU architecture reported by the host. Absent for older agents, unknown hosts, and cluster aggregates.
            node: {type: string, maxLength: 253}
            workloads:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/HostWorkload'
    TelemetryBatch:
      type: object
      required: [source, observedAt, hosts]
      properties:
        source:
          $ref: '#/components/schemas/SourceRef'
        observedAt: {type: string, format: date-time}
        hosts:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/HostObservation'
    Host:
      allOf:
        - $ref: '#/components/schemas/HostObservation'
        - type: object
          required: [id, name, kind, source, parentId, observedAt, receivedAt, status]
          properties:
            id: {type: string}
            name: {type: string}
            kind: {type: string, enum: [docker, cluster, node, unknown]}
            source:
              $ref: '#/components/schemas/SourceRef'
            parentId: {type: string}
            observedAt: {type: string, format: date-time, nullable: true}
            receivedAt: {type: string, format: date-time, nullable: true}
            status: {type: string, enum: [fresh, partial, stale, unavailable]}
    HostSample:
      allOf:
        - $ref: '#/components/schemas/HostMetrics'
        - type: object
          required: [at]
          properties:
            at: {type: string, format: date-time}
    HostDetail:
      type: object
      required: [host, children, samples, range]
      properties:
        host:
          $ref: '#/components/schemas/Host'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/HostSample'
        range: {type: string, enum: [1h, 24h]}
    UploadedIcon:
      type: object
      required: [id, name, tags, mime, digest, usedBy]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: string
        mime:
          type: string
        digest:
          type: string
        usedBy:
          type: array
          items:
            type: string
    IconUpload:
      type: object
      additionalProperties: false
      required: [name, tags]
      properties:
        name:
          type: string
          maxLength: 200
        tags:
          type: string
          maxLength: 1000
        data:
          type: string
          format: byte
          description: Base64 image bytes. Omit to keep existing image.
        digest:
          type: string
          description: Existing image revision required for updates.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    SourceRef:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
        id:
          type: string

    NotificationSource:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, enum: [core, plugin, external]}
        id: {type: string}
        connectionId: {type: string, nullable: true}

    NotificationDestination:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [core, plugin, external]}
        route: {type: string}
        pluginId: {type: string}
        connectionId: {type: string}
        page: {type: string}
        params: {type: object, additionalProperties: {type: string}}
        query: {type: object, additionalProperties: {type: array, items: {type: string}}}
        url: {type: string, format: uri}

    NotificationPublishRequest:
      type: object
      additionalProperties: false
      required: [eventId, severity, title, occurredAt]
      properties:
        eventId: {type: string, maxLength: 128}
        severity: {type: string, enum: [info, success, warning, critical]}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 4000}
        occurredAt: {type: string, format: date-time}
        destination: {$ref: '#/components/schemas/NotificationDestination', nullable: true}

    Notification:
      type: object
      additionalProperties: false
      required: [id, source, eventId, severity, title, body, occurredAt, receivedAt, readAt]
      properties:
        id: {type: string, format: uuid}
        source: {$ref: '#/components/schemas/NotificationSource'}
        eventId: {type: string}
        severity: {type: string, enum: [info, success, warning, critical]}
        title: {type: string}
        body: {type: string}
        occurredAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time}
        destination: {$ref: '#/components/schemas/NotificationDestination', nullable: true}
        readAt: {type: string, format: date-time, nullable: true}

    NotificationReceipt:
      type: object
      additionalProperties: false
      required: [id, createdAt, accepted]
      properties:
        id: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        accepted: {type: boolean}

    NotificationPage:
      type: object
      additionalProperties: false
      required: [notifications, unreadCount]
      properties:
        notifications: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        unreadCount: {type: integer, format: int32, minimum: 0}
        nextCursor: {type: string, nullable: true}

    ResourceRef:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
    ServiceEndpoint:
      type: object
      required:
        - name
        - url
        - port
        - protocol
        - provenance
      properties:
        name:
          type: string
        url:
          type: string
          description: Empty when discovery has no exact hostname or route; HTTPRoute observations may be scheme-relative.
        port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          description: Zero when no port was observed.
        protocol:
          type: string
        provenance:
          type: string
          description: Adapter evidence for the endpoint observation.
    ResourceObservation:
      type: object
      required: [resource, endpoints, images]
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          items:
            type: string
    ManualServiceCreate:
      type: object
      additionalProperties: false
      required: [requestId, displayName, description, address]
      properties:
        requestId:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: Random client-generated key reused on retries. Replays never overwrite later edits.
        displayName: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        address: {type: string, minLength: 1, maxLength: 2048, description: Absolute HTTP(S) address without credentials}
        icon: {type: string, maxLength: 256}
    ServiceEdit:
      type: object
      additionalProperties: false
      required: [displayName, description, address]
      properties:
        icon:
          type: string
          maxLength: 256
          description: Icon reference. Empty resets to discovery; omitted preserves selection.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        address:
          type: string
          maxLength: 2048
          description: Absolute HTTP(S) homepage address; empty uses discovery
    ServiceCandidate:
      type: object
      required:
        - status
        - missing
        - id
        - source
        - resource
        - displayName
        - description
        - metadata
        - endpoints
        - images
        - observedAt
        - pinned
        - pinnedAt
      properties:
        status:
          type: string
          enum: [live, missing, hidden]
          description: Hidden takes precedence over missing until the user shows the service again.
        missing:
          type: boolean
          description: Absent from the latest successful source snapshot, including when hidden.
        icon:
          type: string
          description: Local icon reference; empty uses discovery.
        address:
          type: string
          description: Local homepage address override; empty uses discovery
        resources:
          type: array
          description: Resource evidence grouped under this Service; pin identity remains the Service ID.
          items:
            $ref: '#/components/schemas/ResourceObservation'
        id:
          type: string
        source:
          $ref: '#/components/schemas/SourceRef'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        displayName:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          description: Container images observed for the candidate, when available.
          items:
            type: string
        observedAt:
          type: string
          format: date-time
        pinned:
          type: boolean
        pinnedAt:
          type: string
          format: date-time
          nullable: true
    ServiceListResponse:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCandidate'
    DiscoverySyncResponse:
      type: object
      required:
        - sources
        - candidates
      properties:
        sources:
          type: integer
          format: int32
          minimum: 0
        candidates:
          type: integer
          format: int32
          minimum: 0
    FederationSnapshot:
      type: object
      required:
        - source
        - candidates
        - observedAt
      properties:
        source:
          $ref: '#/components/schemas/SourceRef'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FederatedCandidate'
        observedAt:
          type: string
          format: date-time
    FederatedCandidate:
      type: object
      required:
        - id
        - source
        - resource
        - displayName
        - description
        - metadata
        - endpoints
        - images
        - observedAt
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/SourceRef'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        displayName:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        images:
          type: array
          items:
            type: string
        observedAt:
          type: string
          format: date-time
