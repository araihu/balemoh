    HostMetrics:
      type: object
      required: [cpuPercent, memoryUsedBytes, memoryTotalBytes]
      properties:
        cpuPercent: {type: number, format: double, nullable: true, minimum: 0, maximum: 100, description: Host
            CPU usage as a percentage from 0 to 100; null when unavailable., example: 23.4}
        memoryUsedBytes: {type: integer, format: int64, nullable: true, minimum: 0, description: Used host
            memory in bytes; null when unavailable., example: 8589934592}
        memoryTotalBytes: {type: integer, format: int64, nullable: true, minimum: 1, description: Total host
            memory in bytes; positive when available., example: 34359738368}
      description: Basic host measurements. Null means unavailable, not zero. CPU is a percentage of total CPU
        capacity. Memory values are bytes and must be present as a valid pair.
      example:
        cpuPercent: 23.4
        memoryUsedBytes: 8589934592
        memoryTotalBytes: 34359738368
    HostWorkload:
      type: object
      required: [name, namespace, state, restarts]
      properties:
        name: {type: string, minLength: 1, maxLength: 253, description: Reported container or pod name.,
            example: grafana}
        namespace: {type: string, maxLength: 253, description: 'Kubernetes pod namespace, or an empty string for
            Docker.', example: ''}
        state: {type: string, minLength: 1, maxLength: 64, description: Runtime state such as running for
            Docker or Running for a pod., example: running}
        restarts: {type: integer, minimum: 0, description: Reported Kubernetes pod restart count; Docker
            reports zero because restart counts are not collected., example: 0}
        node:
          type: string
          maxLength: 253
          description: Kubernetes node hosting the pod. Omitted when unknown or not reported by the runtime.
          example: atlas
        ready:
          type: boolean
          description: Pod Ready condition. Absent when unknown, from older agents, or for Docker containers. Does not verify HTTP reachability.
          example: true
        reason:
          type: string
          maxLength: 253
          description: Current pod or container waiting/termination reason, never a previous termination reason.
          example: CrashLoopBackOff
        images:
          type: array
          maxItems: 64
          description: Container image references reported for this workload. Omitted when unavailable.
          items:
            type: string
            minLength: 1
            maxLength: 2048
          example: [grafana/grafana:12.0.0]
      description: A reported container or pod with runtime state. Docker does not collect restart counts, so
        its restart field is zero; Kubernetes pod reports include namespace and restarts.
      example:
        name: grafana
        namespace: ''
        state: running
        restarts: 0
    HostObservation:
      allOf:
        - $ref: '#/components/schemas/HostMetrics'
        - type: object
          required: [node, workloads, inventoryAvailable, ready]
          properties:
            inventoryAvailable: {type: boolean, description: True when the workload list is complete and
                available. False is different from an available empty list and can indicate truncation.,
                example: true}
            ready: {type: string, description: 'Kubernetes node readiness: True, False, Unknown, or empty when not
                applicable.', example: ''}
            architecture:
              type: string
              maxLength: 64
              description: Host CPU architecture such as amd64 or arm64. Optional for older agents and unknown
                hosts; omit on cluster aggregates.
              example: amd64
            node: {type: string, maxLength: 253, description: Empty for the source root; Kubernetes node name
                for a child observation., example: ''}
            workloads:
              type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/HostWorkload'
              description: Reported workload inventory, limited to 1000 entries for this host.
              example:
                - name: grafana
                  namespace: ''
                  state: running
                  restarts: 0
          description: Host identity within the source, architecture, readiness, and workload inventory.
          example:
            inventoryAvailable: true
            ready: ''
            architecture: amd64
            node: ''
            workloads:
              - name: grafana
                namespace: ''
                state: running
                restarts: 0
      description: One host observation. An empty node identifies the source root. A Kubernetes batch can
        include named child nodes; a Docker batch contains only its root. Inventory availability is separate
        from CPU and memory availability.
      example:
        cpuPercent: 23.4
        memoryUsedBytes: 8589934592
        memoryTotalBytes: 34359738368
        node: ''
        architecture: amd64
        inventoryAvailable: true
        ready: ''
        workloads:
          - name: grafana
            namespace: ''
            state: running
            restarts: 0
    TelemetryBatch:
      type: object
      required: [source, observedAt, hosts]
      properties:
        source:
          $ref: '#/components/schemas/SourceRef'
        observedAt: {type: string, format: date-time, description: UTC collection time shared by every host in
            this batch., example: '2026-10-25T12:00:00Z'}
        hosts:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/HostObservation'
          description: Root and optional child observations. Always include node=""; container sources contain
            exactly one host.
          example:
            - cpuPercent: 23.4
              memoryUsedBytes: 8589934592
              memoryTotalBytes: 34359738368
              node: ''
              architecture: amd64
              inventoryAvailable: true
              ready: ''
              workloads:
                - name: grafana
                  namespace: ''
                  state: running
                  restarts: 0
      description: A source-bound report collected at observedAt. Requires a root observation, unique node
        names, at most 128 hosts, and at most 1000 workloads per host. One source retains no more than 128
        hosts. Telemetry times must be within the last 24 hours and at most 30 seconds ahead of the gateway
        clock.
      example:
        source:
          kind: container
          id: atlas
        observedAt: '2026-10-25T12:00:00Z'
        hosts:
          - cpuPercent: 23.4
            memoryUsedBytes: 8589934592
            memoryTotalBytes: 34359738368
            node: ''
            architecture: amd64
            inventoryAvailable: true
            ready: ''
            workloads:
              - name: grafana
                namespace: ''
                state: running
                restarts: 0
    Host:
      allOf:
        - $ref: '#/components/schemas/HostObservation'
        - type: object
          required: [id, name, kind, source, parentId, observedAt, receivedAt, status]
          properties:
            id: {type: string, description: Opaque stable host identity. Use the value returned by the host
                API., example: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf}
            name: {type: string, description: Source ID for a root or node name for a Kubernetes child.,
                example: atlas}
