openapi: 3.0.3
info:
  title: Balemoh API
  version: 0.1.0
  description: |-
    Balemoh is a self-hosted homepage for services discovered in Kubernetes, Docker,
    and Podman. This API backs the UI and accepts snapshots from federated agents.

    Start by listing Staging to obtain stable service IDs and review endpoint evidence.
    Save local display settings, then pin live services to add homepage cards. Manual
    services start unpinned. Host widget selection is separate, and host telemetry is
    opt-in. Discovery refreshes preserve gateway-owned display edits and pin choices.

    The documented server is the local development API. Use your private instance's
    API origin for integrations; this static documentation website does not serve the
    API. Catalog, dashboard, host, and icon endpoints have no built-in authentication
    and rely on your network or reverse-proxy access boundary. Federation imports
    require a Bearer token registered for the exact source kind and ID in the body.

    Plugin metadata, queries and widget configuration require the private BFF service
    credential. Notification inbox operations require the separate operator credential;
    external publication uses a source-bound publisher credential. These roles cannot
    substitute for one another. Plugin publication uses its connection-scoped runtime.

    Check HTTP status and Content-Type. Structured success responses use JSON, but
    errors can be ErrorResponse JSON or plain text as documented for each operation.
    Reuse requestId when retrying manual creation. Pin, unpin, and widget selection
    set the desired state. Refresh current state after a 409 before retrying a
    lifecycle action or an icon revision update. No-content responses have no body.

    Examples use synthetic data and reserved example.test addresses. Replace fixed
    observation timestamps with current UTC before importing federation payloads.
    Obtain IDs and icon revision digests from API responses. The integration guide
    provides a complete request sequence; operation and schema sections below cover
    field meaning, response formats, limits, and failure cases.
  contact:
    name: Balemoh maintainers
    url: https://github.com/araihu/balemoh/issues
paths:
  /api/v1/plugin-widgets:
    get:
      operationId: GetPluginWidgets
      security:
      - PluginService: []
      responses:
        '200':
          description: Widget definitions and retained placements
          content:
            application/json:
              schema:
                type: object
                required:
                - definitions
                - placements
                properties:
                  definitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginWidgetDefinition'
                    example: []
                  placements:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginPlacement'
                    example: []
              example:
                definitions: []
                placements: []
        '401':
          description: A valid BFF service credential is required to list widget definitions and placements.
        '503':
          description: The service cannot list widget definitions and placements because required storage or
            plugin metadata is unavailable.
      tags:
      - Plugins
      summary: List widget definitions and placements
      description: Read installed widget definitions and all retained placements. Saved configuration remains
        available when a plugin or its source is unavailable.
  /api/v1/plugin-widgets/{placementId}:
    parameters:
    - name: placementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Client-selected placement UUID. Reuse it for create retries.
      example: 00000000-0000-4000-8000-000000000002
    put:
      operationId: PutPluginWidget
      security:
      - PluginService: []
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
        description: Current quoted placement revision from ETag. Required when updating this placement.
        example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginPlacementBody'
            example:
              pluginId: example.status
              connectionId: 00000000-0000-4000-8000-000000000001
              contributionId: summary
              options: {}
              enabled: true
        description: Widget configuration to retain.
      responses:
        '201':
          description: Placement created
          headers:
            ETag:
              schema:
                type: string
              description: Quoted revision of the newly created placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPlacement'
              example:
                pluginId: example.status
                connectionId: 00000000-0000-4000-8000-000000000001
                contributionId: summary
                options: {}
                enabled: true
                placementId: 00000000-0000-4000-8000-000000000002
                revision: '1'
                createdAt: '2026-10-26T12:00:00Z'
                updatedAt: '2026-10-26T12:00:00Z'
        '200':
          description: Identical create replay or updated placement
          headers:
            ETag:
              schema:
                type: string
              description: Quoted revision retained after this save or identical replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPlacement'
              example:
                pluginId: example.status
                connectionId: 00000000-0000-4000-8000-000000000001
                contributionId: summary
                options: {}
                enabled: true
                placementId: 00000000-0000-4000-8000-000000000002
                revision: '1'
                createdAt: '2026-10-26T12:00:00Z'
                updatedAt: '2026-10-26T12:00:00Z'
        '400':
          description: Invalid body or options
        '401':
          description: A valid BFF service credential is required to save widget configuration.
        '404':
          description: Connection or definition missing
        '409':
          description: Create identity conflict or capacity reached
        '412':
          description: The retained placement revision changed before this save.
        '428':
          description: Placement save requires its current revision in If-Match.
      tags:
      - Plugins
      summary: Save a widget placement
      description: Create a placement under a client-selected UUID or update its saved options and enabled state.
        Updates require the quoted revision in If-Match; an identical create replay returns the retained placement.
    delete:
      operationId: DeletePluginWidget
      security:
      - PluginService: []
      parameters:
      - name: If-Match
        in: header
        schema:
          type: string
        description: Current quoted placement revision from ETag. Required to delete this placement.
        example: '"1"'
      responses:
        '204':
          description: Configuration removed, source data untouched
        '401':
          description: A valid BFF service credential is required to delete widget configuration.
        '404':
          description: Placement absent
        '412':
          description: The retained placement revision changed before this deletion.
        '428':
          description: Placement deletion requires its current revision in If-Match.
      tags:
      - Plugins
      summary: Remove a widget placement
      description: Delete saved widget configuration using its current quoted If-Match revision. This does not
        modify data in the plugin source.
  /api/v1/plugins:
    get:
      operationId: GetPlugins
      security:
      - PluginService: []
      responses:
        '200':
          description: Data-only plugin descriptors, without deployment paths or credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCatalog'
              example:
                plugins: []
                problems: []
        '401':
          description: A valid BFF service credential is required to list installed plugins.
        '503':
          description: The service cannot list installed plugins because required storage or plugin metadata
            is unavailable.
      tags:
      - Plugins
      summary: List installed plugins
      description: Read local installation and connection metadata without calling plugin processes. Executable
        paths, configuration secrets and credentials are excluded.
  /api/v1/plugins/{pluginId}/connections/{connectionId}/queries/{queryId}:
    post:
      operationId: QueryPlugin
      security:
      - PluginService: []
      parameters:
      - name: pluginId
        in: path
        required: true
        schema:
          type: string
        description: Installed plugin identifier returned by the plugin catalog.
        example: example.status
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
        description: Configured connection ID returned by the plugin catalog.
        example: 00000000-0000-4000-8000-000000000001
      - name: queryId
        in: path
        required: true
        schema:
          type: string
        description: Declared query identifier returned by the connection descriptor.
        example: list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              additionalProperties: false
              properties:
                input:
                  type: object
                  additionalProperties: true
                  example: {}
            example:
              input: {}
        description: Declared query input object.
      responses:
        '200':
          description: Validated cached observation; never performs collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginQueryResult'
              example:
                data:
                  count: 2
                state: fresh
                observationRevision: '1'
                observedAt: '2026-10-26T12:00:00Z'
                lastSuccessAt: '2026-10-26T12:00:00Z'
        '400':
          description: Invalid query input
        '401':
          description: A valid BFF service credential is required to query a plugin observation.
        '403':
          description: Connection disabled or operation not granted
        '404':
          description: Unknown plugin, connection or operation
        '409':
          description: Observation revision changed
        '413':
          description: Query input exceeds limit
        '429':
          description: Plugin query capacity exceeded
        '502':
          description: Invalid plugin output
        '503':
          description: The service cannot query a plugin observation because required storage or plugin metadata
            is unavailable.
        '504':
          description: Plugin query exceeded the host deadline
      tags:
      - Plugins
      summary: Query a plugin observation
      description: Run a declared query for one enabled connection with its configured grants. Queries read the
        cached observation and do not start collection. Input is limited to 64 KiB and host deadlines bound the
        call.
  /api/v1/dashboard:
    get:
      operationId: GetDashboard
      responses:
        '200':
          description: Selected widgets and unavailable source providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
              example:
                items:
                  - id: service-57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
                    kind: service-links
                    presentation: card
                    sourceKind: service
                    sourceId: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
                    title: Grafana
                    data:
                      id: 57dc88a4d1a5dec8a34e00cc6ff3683bd1b6343cd32f573356a0c6fb07161f14
                      source:
                        kind: container
                        id: atlas
                      resource:
                        kind: container
                        name: grafana
                      displayName: Grafana
                      description: Metrics and dashboards
                      metadata:
                        fixture: synthetic
                      endpoints:
                        - name: https
                          url: https://grafana.example.test
                          port: 443
                          protocol: HTTPS
                          provenance: synthetic
                      images: []
                      observedAt: '2026-10-25T12:00:00Z'
                      status: live
                      missing: false
                      icon: selfhst:grafana
                      address: ''
                      resources:
                        - resource:
                            kind: container
                            name: grafana
                          endpoints:
                            - name: https
                              url: https://grafana.example.test
                              port: 443
                              protocol: HTTPS
                              provenance: synthetic
                          images: []
                      pinned: true
                      pinnedAt: '2026-10-25T12:00:00Z'
                    error: ''
                unavailable: []
        '503':
          description: Unable to read the selected homepage widgets because required storage or a provider is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Dashboard
      summary: Read the selected homepage widgets
      description: |-
        Returns selected service and host widgets. A failed provider is listed in unavailable while other providers can still return items with HTTP 200. A widget can carry an error and an empty data object when its source is no longer available. Responses use Cache-Control: no-store.

  /api/v1/notifications:
    delete:
      operationId: ClearNotifications
      description: Permanently remove all stored notifications, read and unread, across sources and pages. This
        also resets their deduplication identities. Messages committed after the clear statement remain. No source
        alerts are changed.
      security:
      - NotificationOperator: []
      responses:
        '204':
          description: Inbox cleared, including an already empty inbox
        '401':
          description: A valid operator credential is required to clear the retained inbox.
        '503':
          description: The service cannot clear the retained inbox because required storage or plugin metadata
            is unavailable.
      tags:
      - Notifications
      summary: Clear all notifications
    get:
      operationId: GetNotifications
      security:
      - NotificationOperator: []
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Opaque nextCursor from the previous response; omit it for the newest page.
        example: bm90aWZpY2F0aW9uOjU
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return only unread messages when true. The unread total remains global.
        example: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 50
        description: Maximum number of messages in this page, from 1 through 50.
        example: 50
      responses:
        '200':
          description: One stable inbox page and unread total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                notifications:
                - id: 00000000-0000-4000-8000-000000000001
                  source:
                    kind: external
                    id: example-monitor
                  eventId: maintenance-20261026
                  severity: success
                  title: Maintenance complete
                  body: Datastore maintenance finished.
                  occurredAt: '2026-10-26T12:00:00Z'
                  destination:
                    kind: external
                    url: https://status.example.test/incidents/123
                  receivedAt: '2026-10-26T12:00:00Z'
                  readAt: null
                unreadCount: 1
                retentionDays: 30
        '400':
          description: Invalid cursor or page options
        '401':
          description: A valid operator credential is required to list retained notifications.
        '503':
          description: The service cannot list retained notifications because required storage or plugin metadata
            is unavailable.
      tags:
      - Notifications
      summary: List retained notifications
      description: Read an inbox page without marking messages read. Use nextCursor as before for older messages
        and unread to restrict the page. unreadCount is the global unread total, independent of the page filter.
    post:
      operationId: PublishNotification
      security:
      - NotificationPublisher: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPublishRequest'
            example:
              eventId: maintenance-20261026
              severity: success
              title: Maintenance complete
              body: Datastore maintenance finished.
              occurredAt: '2026-10-26T12:00:00Z'
              destination:
                kind: external
                url: https://status.example.test/incidents/123
        description: Immutable event content from the authenticated publisher.
      responses:
        '201':
          description: New notification durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReceipt'
              example:
                id: 00000000-0000-4000-8000-000000000001
                createdAt: '2026-10-26T12:00:00Z'
                accepted: true
        '200':
          description: Identical event replay acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReceipt'
              example:
                id: 00000000-0000-4000-8000-000000000001
                createdAt: '2026-10-26T12:00:00Z'
                accepted: true
        '400':
          description: Invalid notification envelope
        '401':
          description: A valid external publisher credential is required to publish an external notification.
        '409':
          description: Event identity conflicts with immutable content
        '413':
          description: Request body exceeds 16 KiB
        '429':
          description: Producer concurrency or inbox capacity exceeded
        '503':
          description: The service cannot publish an external notification because required storage or plugin
            metadata is unavailable.
        '404':
          description: External publishing is not configured
      tags:
      - Notifications
      summary: Publish an external notification
      description: Publish a message using a configured source-bound external publisher credential. An identical
        eventId replay returns the original receipt; conflicting content returns 409. The operator credential
        cannot publish, and this endpoint does not mutate source alerts.
  /api/v1/notifications/read:
    put:
      operationId: MarkAllNotificationsRead
      security:
      - NotificationOperator: []
      responses:
        '204':
          description: All retained unread notifications marked read atomically. Already-read timestamps and
            later publications are preserved.
        '401':
          description: A valid operator credential is required to mark the retained inbox read.
        '503':
          description: The service cannot mark the retained inbox read because required storage or plugin metadata
            is unavailable.
      tags:
      - Notifications
      summary: Mark all notifications read
      description: Atomically mark retained unread messages as read. Already-read timestamps and messages committed
        after the update remain unchanged. Source alerts are unaffected.
  /api/v1/notifications/{notificationId}/read:
    parameters:
    - name: notificationId
      in: path
      required: true
      schema:
        type: string
      description: Identifier of the retained notification to mark read.
      example: 00000000-0000-4000-8000-000000000001
    put:
      operationId: MarkNotificationRead
      security:
      - NotificationOperator: []
      responses:
        '204':
          description: Notification marked read, including an idempotent replay
        '401':
          description: A valid operator credential is required to mark this notification read.
        '404':
          description: The notification to mark read is no longer retained.
        '503':
          description: The service cannot mark this notification read because required storage or plugin metadata
            is unavailable.
      tags:
      - Notifications
      summary: Mark a notification read
      description: Set the read timestamp for one retained notification. Repeated requests preserve the original
        read timestamp and do not resolve or modify source alerts.
  /api/v1/notifications/{notificationId}:
    parameters:
    - name: notificationId
      in: path
      required: true
      schema:
        type: string
      description: Identifier of the retained notification to inspect.
      example: 00000000-0000-4000-8000-000000000001
    get:
      operationId: GetNotification
      security:
      - NotificationOperator: []
      responses:
        '200':
          description: One notification without changing its read state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: 00000000-0000-4000-8000-000000000001
                source:
                  kind: external
                  id: example-monitor
                eventId: maintenance-20261026
                severity: success
                title: Maintenance complete
                body: Datastore maintenance finished.
                occurredAt: '2026-10-26T12:00:00Z'
                destination:
                  kind: external
                  url: https://status.example.test/incidents/123
                receivedAt: '2026-10-26T12:00:00Z'
                readAt: null
        '401':
          description: A valid operator credential is required to read this notification.
        '404':
          description: No retained notification has the requested identifier.
        '503':
          description: The service cannot read this notification because required storage or plugin metadata
            is unavailable.
      tags:
      - Notifications
      summary: Read a notification
      description: Read one retained notification by ID without changing its read state or opening its destination.
  /api/v1/dashboard/widgets/{sourceKind}/{sourceId}:
    put:
      operationId: SetDashboardSelection
      parameters:
        - {name: sourceKind, in: path, required: true, schema: {type: string}, description: Selection
            provider. Use service for a catalog pin or host for a telemetry widget., example: host}
        - {name: sourceId, in: path, required: true, schema: {type: string}, description: Opaque ID returned
            by the service catalog or host list for the chosen provider., example:
            485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: {type: boolean, description: Whether this source should be selected for the homepage.,
                  example: true}
              example:
                enabled: true
            example:
              enabled: true
        description: Desired selection state. Both enabled=true and enabled=false are explicit, repeatable
          operations.
      responses:
        '204':
          description: Desired selection saved, including repeated requests
        '400':
          description: Malformed selection JSON, unsupported provider, or invalid source ID.
          content:
            text/plain:
              schema:
                type: string
                example: "Invalid selection\n"
              example: "Invalid selection\n"
        '404':
          description: The source to enable no longer exists.
          content:
            text/plain:
              schema:
                type: string
                example: "Source not found\n"
              example: "Source not found\n"
        '409':
          description: The host selection limit is reached or a service changed state before selection.
          content:
            text/plain:
              schema:
                type: string
                example: "Selection limit reached or source state changed\n"
              example: "Selection limit reached or source state changed\n"
        '503':
          description: Unable to set a widget selection because required storage or a provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Dashboard
      summary: Set a widget selection
      description: |-
        Set enabled to true or false for a service or host ID obtained from the catalog or host list. Repeated requests set the same desired state. Service selection uses the catalog pin rules, so a hidden or missing service cannot be enabled. Host selections are retained separately, with a maximum of 128 selected hosts. Disabling a removed host is allowed so its stale widget can be cleared.
  /api/v1/hosts:
    get:
      operationId: GetHosts
      responses:
        '200':
          description: Registered and discovered source roots
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
                    description: Docker machines and Kubernetes clusters registered at this gateway.
                    example:
                      - cpuPercent: 23.4
                        memoryUsedBytes: 8589934592
                        memoryTotalBytes: 34359738368
                        node: ''
                        architecture: amd64
                        inventoryAvailable: true
                        ready: ''
                        workloads:
                          - name: grafana
                            namespace: ''
                            state: running
                            restarts: 0
                        id: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf
                        name: atlas
                        kind: docker
                        source:
                          kind: container
                          id: atlas
                        parentId: ''
                        observedAt: '2026-10-25T12:00:00Z'
                        receivedAt: '2026-10-25T12:00:00Z'
                        status: fresh
                description: Registered source roots, excluding Kubernetes child nodes.
                example:
                  hosts:
                    - cpuPercent: 23.4
                      memoryUsedBytes: 8589934592
                      memoryTotalBytes: 34359738368
                      node: ''
                      architecture: amd64
                      inventoryAvailable: true
                      ready: ''
                      workloads:
                        - name: grafana
                          namespace: ''
                          state: running
                          restarts: 0
                      id: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf
                      name: atlas
                      kind: docker
                      source:
                        kind: container
                        id: atlas
                      parentId: ''
                      observedAt: '2026-10-25T12:00:00Z'
                      receivedAt: '2026-10-25T12:00:00Z'
                      status: fresh
              example:
                hosts:
                  - cpuPercent: 23.4
                    memoryUsedBytes: 8589934592
                    memoryTotalBytes: 34359738368
                    node: ''
                    architecture: amd64
                    inventoryAvailable: true
                    ready: ''
                    workloads:
                      - name: grafana
                        namespace: ''
                        state: running
                        restarts: 0
                    id: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf
                    name: atlas
                    kind: docker
                    source:
                      kind: container
                      id: atlas
                    parentId: ''
                    observedAt: '2026-10-25T12:00:00Z'
                    receivedAt: '2026-10-25T12:00:00Z'
                    status: fresh
        '503':
          description: Unable to list registered host roots because required storage or a provider is
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: unavailable
                message: catalog unavailable
      tags:
        - Hosts
      summary: List registered host roots
      description: |-
        Returns Docker host and Kubernetes cluster roots, including registered discovery-only sources with status unavailable before their first telemetry report. Kubernetes nodes are children of a cluster and appear in that cluster's detail response, not in this top-level list. No live collection is triggered.
  /api/v1/hosts/{hostId}:
    get:
      operationId: GetHost
      parameters:
        - name: hostId
          in: path
          required: true
          schema: {type: string}
          description: Stable host ID returned by GET /api/v1/hosts or a cluster detail response.
          example: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf
        - name: range
          in: query
          schema: {type: string, enum: [1h, 24h], default: 1h}
          description: History interval. Defaults to 1h and accepts only 1h or 24h; returns one UTC minute
            slot per minute.
          example: 1h
      responses:
        '200':
          description: Host detail with one-minute samples and explicit null gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDetail'
              example:
                host:
                  cpuPercent: 23.4
                  memoryUsedBytes: 8589934592
                  memoryTotalBytes: 34359738368
                  node: ''
                  architecture: amd64
                  inventoryAvailable: true
                  ready: ''
                  workloads:
                    - name: grafana
                      namespace: ''
                      state: running
                      restarts: 0
                  id: 485497dc6417c5261c07e22ad6153c982eb4e0613c6a4bd568b361bc20190bbf
                  name: atlas
                  kind: docker
                  source:
                    kind: container
                    id: atlas
                  parentId: ''
                  observedAt: '2026-10-25T12:00:00Z'
