        description: Image name, tags, and nonempty Base64-encoded bytes for a new upload.
      responses:
        '201':
          description: Icon stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
              example:
                id: upload:EXAMPLE
                name: Lab icon
                tags: lab,green
                mime: image/svg+xml
                digest: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
                usedBy: []
        '400':
          description: 'The icon metadata, image, or JSON body is invalid. Operation: Upload a service icon.'
          content:
            text/plain:
              schema:
                type: string
                example: "Bad Request\n"
              example: "Bad Request\n"
        '503':
          description: Uploaded image storage is unavailable while attempting to upload a service icon.
          content:
            text/plain:
              schema:
                type: string
                example: "Icons unavailable\n"
              example: "Icons unavailable\n"
      tags:
        - Icons
      summary: Upload a service icon
      description: |-
        Creates an uploaded icon from Base64-encoded image bytes. data is required in practice for creation, even though the shared update schema allows it to be omitted. Supported formats are PNG, JPEG, WebP, and passive SVG, limited to 2 MiB and 4096 pixels. SVG scripts, CSS, embedded images, and external references are rejected. The JSON request is limited to 3 MiB. Use the returned upload: ID in a service edit; storing an icon does not select it for a service.
  /api/v1/icons/{iconID}:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
        description: 'Uploaded icon reference returned by icon creation or listing, including its upload: prefix.'
        example: upload:EXAMPLE
    put:
      operationId: updateIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IconUpload'
            example:
              name: Lab icon
              tags: lab,green
              digest: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
        description: Replacement metadata and current revision, with optional replacement image bytes.
      responses:
        '200':
          description: Icon updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedIcon'
              example:
                id: upload:EXAMPLE
                name: Lab icon
                tags: lab,green
                mime: image/svg+xml
                digest: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
                usedBy: []
        '400':
          description: 'The icon metadata, image, or JSON body is invalid. Operation: Update an uploaded icon revision.'
          content:
            text/plain:
              schema:
                type: string
                example: "Bad Request\n"
              example: "Bad Request\n"
        '404':
          description: 'This uploaded icon cannot be found. Operation: Update an uploaded icon revision.'
          content:
            text/plain:
              schema:
                type: string
                example: "Not Found\n"
              example: "Not Found\n"
        '409':
          description: 'The uploaded icon changed, remains in use, or cannot be deleted at this revision. Operation:
            Update an uploaded icon revision.'
          content:
            text/plain:
              schema:
                type: string
                example: "Conflict\n"
              example: "Conflict\n"
        '503':
          description: Uploaded image storage is unavailable while attempting to update an uploaded icon
            revision.
          content:
            text/plain:
              schema:
                type: string
                example: "Icons unavailable\n"
              example: "Icons unavailable\n"
      tags:
        - Icons
      summary: Update an uploaded icon revision
      description: |-
        Updates an existing uploaded icon without changing its ID, so referencing services keep their choice. Send the current digest from the icon list. Omitting data or sending empty data keeps the current bytes while changing name or tags. A stale or missing revision returns 409; list icons again before retrying. Validation and request size limits match icon upload.
    delete:
      operationId: deleteIcon
      parameters:
        - name: digest
          in: query
          required: true
          schema:
            type: string
          description: Current icon revision from the uploaded icon list. Deletion fails with 409 if the
            revision changed or the icon is in use.
          example: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
      responses:
        '204':
          description: Unused icon deleted
        '409':
          description: 'The uploaded icon changed, remains in use, or cannot be deleted at this revision. Operation:
            Delete an unused uploaded icon.'
          content:
            text/plain:
              schema:
                type: string
                example: "Conflict\n"
              example: "Conflict\n"
        '503':
          description: Uploaded image storage is unavailable while attempting to delete an unused uploaded
            icon.
          content:
            text/plain:
              schema:
                type: string
                example: "Icons unavailable\n"
              example: "Icons unavailable\n"
      tags:
        - Icons
      summary: Delete an unused uploaded icon
      description: |-
        Deletes only when the supplied digest matches the current revision and no service references the icon. Returns 409 for an icon that is in use, changed, or no longer exists. Re-read the icon list before retrying. Bundled icons cannot be deleted with this endpoint.
  /api/v1/icons/{iconID}/image:
    parameters:
      - name: iconID
        in: path
        required: true
        schema:
          type: string
        description: 'Uploaded image to download. Use its complete upload: reference from the icon list.'
        example: upload:EXAMPLE
    get:
      operationId: getIconImage
      responses:
        '200':
          description: Validated image
          content:
            image/*:
              schema:
                type: string
                format: binary
              examples:
                png:
                  summary: Illustrative PNG bytes, returned directly without a JSON envelope
                  externalValue: https://balemoh.araihu.com/site/assets/social-v1.png
          headers:
            ETag:
              description: Quoted current icon digest. Send it in If-None-Match to reuse a cached image.
              schema:
                type: string
              example: '"862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77"'
        '404':
          description: 'This uploaded icon cannot be found. Operation: Download an uploaded icon image.'
          content:
            text/plain:
              schema:
                type: string
                example: "Not Found\n"
              example: "Not Found\n"
        '503':
          description: Uploaded image storage is unavailable while attempting to download an uploaded icon
            image.
          content:
            text/plain:
              schema:
                type: string
                example: "Icons unavailable\n"
              example: "Icons unavailable\n"
        '304':
          description: The If-None-Match header equals the current digest. Reuse the cached image; this
            response has no body.
      tags:
        - Icons
      summary: Download an uploaded icon image
      description: |-
        Returns raw image bytes with the stored Content-Type, a quoted digest ETag, Cache-Control: no-cache, and X-Content-Type-Options: nosniff. Send that ETag in If-None-Match for a bodyless 304 response. This endpoint serves uploaded IDs only; it does not serve bundled icon references. No JSON envelope is used for successful downloads.
