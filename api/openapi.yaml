      description: |-
        Accepts one source-scoped batch, limited to 2 MiB, 128 retained hosts per source, and 1000 workloads per host. Include the root observation with node set to an empty string; container sources must contain exactly that root. Node names must be unique in the batch. Observation times must be within the previous 24 hours and no more than 30 seconds in the future. Older or repeated reports are acknowledged without advancing stored state or heartbeat. Unknown JSON fields are rejected. This endpoint updates telemetry only; it does not discover services or change pins.
