        tags:
          type: string
          maxLength: 1000
          description: Icon search tags, at most 1000 Unicode code points.
          example: lab,green
        data:
          type: string
          format: byte
          description: Base64 image bytes. Required for creation; omitted or empty retains existing bytes on
            update.
          example:
            PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHJ4PSI0IiBmaWxsPSIjODRjYzE2Ii8+PC9zdmc+
        digest:
          type: string
          description: Current uploaded icon revision, required for updates and ignored for creation.
          example: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
      description: Shared create/update payload for uploaded images. Creation requires nonempty Base64 data.
        Updates require the current digest; omitting data retains the existing image. Supported images are
        limited to 2 MiB and 4096 pixels.
