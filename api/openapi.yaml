          type: string
          description: Discovered absolute or scheme-relative URL; empty if no exact address is known. Not a
            health-check result.
          example: https://grafana.example.test
        port:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
          description: Observed port, or zero when no port was observed.
