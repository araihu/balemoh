          description: 'Assigned upload: reference. Reuse this ID in service icon settings.'
          example: upload:EXAMPLE
        name:
          type: string
          description: User-visible uploaded icon name.
          example: Lab icon
        tags:
          type: string
          description: User-supplied searchable icon tags.
          example: lab,green
        mime:
          type: string
          description: Validated image media type, used by the binary download response.
          example: image/svg+xml
        digest:
          type: string
          description: SHA-256 revision over name, a NUL byte, tags, a NUL byte, and image bytes. Supply it
            for update or delete.
          example: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
        usedBy:
          type: array
          items:
            type: string
          description: Display names of services that currently reference this uploaded icon.
          example: []
      description: Metadata for a user-uploaded icon. digest is a revision of the trimmed name, tags, and
        image bytes, not just an image hash. usedBy lists service display names rather than service IDs.
      example:
        id: upload:EXAMPLE
        name: Lab icon
        tags: lab,green
        mime: image/svg+xml
        digest: 862019886d8c1034c41a62f1972409e18c6f76427f279a2e86469c28ee0cfe77
        usedBy: []
    IconUpload:
      type: object
