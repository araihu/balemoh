          $ref: '#/components/schemas/NotificationSource'
        eventId:
          type: string
          example: maintenance-20261026
        severity:
          type: string
          enum:
          - info
          - success
          - warning
          - critical
          example: success
        title:
          type: string
          example: Maintenance complete
        body:
          type: string
          example: Datastore maintenance finished.
        occurredAt:
          type: string
          format: date-time
