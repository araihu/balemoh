syntax = "proto3";
package balemoh.plugins.v1alpha1;
option go_package = "github.com/araihu/balemoh/plugin-sdk/protocol/v1alpha1;protocol";

import "google/protobuf/empty.proto";

service Control {
  rpc Describe(google.protobuf.Empty) returns (Description);
  rpc CheckHealth(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
}
service UI {
  rpc Handle(UIRequest) returns (UIResponse);
}
service Backend {
  rpc Configure(ConnectionConfig) returns (ConnectionStatus);
  rpc Status(ConnectionID) returns (ConnectionStatus);
  rpc Query(BackendQueryRequest) returns (QueryResult);
  rpc CloseConnection(ConnectionID) returns (google.protobuf.Empty);
}
// Invocation-scoped callback, registered only for the current UI call.
service Host {
  rpc Query(QueryRequest) returns (QueryResult);
  rpc Placement(google.protobuf.Empty) returns (PlacementResult);
  rpc ResolveServices(ServiceIDs) returns (ServiceIdentities);
}
message ServiceIDs { repeated string ids = 1; }
message ServiceIdentity { string id = 1; string name = 2; string icon_url = 3; string icon_sprite_url = 4; string icon_symbol = 5; }
message ServiceIdentities { repeated ServiceIdentity services = 1; }
// Connection-scoped backend callback. UI children never receive this broker.
service BackendHost {
  rpc Publish(NotificationPublishRequest) returns (NotificationReceipt);
 rpc BindService(NotificationServiceBinding) returns (NotificationReceipt);
}
message Description {
  string plugin_id = 1;
  string version = 2;
  string manifest_digest = 3;
  string protocol = 4;
  string ui_profile = 5;
  bool notifications_supported = 6;
}
message Values { repeated string values = 1; }
message UIRequest {
  string request_id = 1;
  string connection_id = 2;
  string placement_id = 3;
  string contribution_type = 4;
  string contribution_id = 5;
  string mode = 6;
  map<string, string> path_params = 7;
  map<string, Values> query = 8;
  string method = 9;
  string region = 10;
  string locale = 11;
  string timezone = 12;
  string theme = 13;
  string color_scheme = 14;
  string base_path = 15;
  string dom_namespace = 16;
  uint32 host_broker_id = 17;
 map<string, Values> form = 18;
 bytes body = 19;
 string package_digest = 20;
}
message UIResponse {
  string kind = 1;
  int32 status = 2;
  string title = 3;
  string description = 4;
  bytes html = 5;
  repeated string asset_ids = 6;
 Redirect redirect = 7;
}
message Redirect { string page = 1; map<string,string> params = 2; map<string,Values> query = 3; }
message QueryRequest { string operation_id = 1; bytes input_json = 2; }
message QueryResult {
  bytes data_json = 1;
  string state = 2;
  string observed_at = 3;
  string last_success_at = 4;
  string observation_revision = 5;
  Failure source_error = 6;
}
message Failure { string code = 1; string message = 2; bool retryable = 3; }
message ConnectionID { string connection_id = 1; }
message ConnectionConfig {
 string connection_id = 1;
 string revision = 2;
 bytes config_json = 3;
 map<string,string> secrets = 4;
 uint32 notifications_broker_id = 5;
}
message ConnectionStatus {
 string connection_id = 1;
 string applied_revision = 2;
 string state = 3;
 string observation_revision = 4;
 string observed_at = 5;
 string last_attempt_at = 6;
 string last_success_at = 7;
 Failure source_error = 8;
}
message BackendQueryRequest { string connection_id = 1; string operation_id = 2; bytes input_json = 3; string request_id = 4; }
message PlacementResult {
  string placement_id = 1;
  string contribution_id = 2;
  bytes options_json = 3;
  string revision = 4;
}
message NotificationPublishRequest {
  NotificationMessage message = 1;
}
message NotificationMessage {
  string service_id = 7;
  string event_id = 1;
  string severity = 2;
  string title = 3;
  string body = 4;
  string occurred_at = 5;
  NotificationDestination destination = 6;
}
message NotificationDestination {
  string kind = 1;
  string route = 2;
  string plugin_id = 3;
  string connection_id = 4;
  string page = 5;
  map<string,string> params = 6;
  map<string,Values> query = 7;
  string url = 8;
}
message NotificationReceipt {
  string id = 1;
  bool created = 2;
}

message NotificationServiceBinding { string event_id = 1; string service_id = 2; }
