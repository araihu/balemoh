version: v2beta1
name: balemoh

vars:
  BALEMOH_NAMESPACE: balemoh-dev
  BALEMOH_KUBERNETES_NAMESPACE: ""
  BALEMOH_SOURCE_ID: devspace-local

deployments:
  rbac:
    namespace: "${BALEMOH_NAMESPACE}"
    kubectl:
      manifests:
      - ./devspace/rbac.yaml
  app:
    namespace: "${BALEMOH_NAMESPACE}"
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
        - name: balemoh
          image: golang:1.26-alpine
          workingDir: /workspace
          command:
          - sh
          - -c
          - go run ./cmd/balemoh
          env:
          - name: BALEMOH_HTTP_ADDR
            value: 0.0.0.0:8080
          - name: BALEMOH_DATABASE_PATH
            value: /tmp/balemoh.db
          - name: BALEMOH_KUBERNETES_ENABLED
            value: "true"
          - name: BALEMOH_KUBERNETES_SOURCE_ID
            value: "${BALEMOH_SOURCE_ID}"
          - name: BALEMOH_KUBERNETES_NAMESPACE
            value: "${BALEMOH_KUBERNETES_NAMESPACE}"
        serviceAccountName: balemoh-discoverer
        automountServiceAccountToken: true
        service:
          ports:
          - name: http
            port: 8080
            containerPort: 8080
  ui:
    namespace: "${BALEMOH_NAMESPACE}"
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
        - name: balemoh-ui
          image: golang:1.27-alpine
          workingDir: /workspace
          command:
          - sh
          - -c
          - cd ui && go run ./cmd/balemoh-ui
          env:
          - name: BALEMOH_UI_HTTP_ADDR
            value: 0.0.0.0:8081
          - name: BALEMOH_UI_API_BASE_URL
            value: http://app:8080
          - name: BALEMOH_UI_REQUEST_TIMEOUT
            value: 5s
          - name: BALEMOH_UI_SHUTDOWN_TIMEOUT
            value: 5s
        automountServiceAccountToken: false
        service:
          ports:
          - name: http
            port: 8081
            containerPort: 8081
  route:
    namespace: "${BALEMOH_NAMESPACE}"
    kubectl:
      manifests:
      - ./devspace/httproute.yaml

dev:
  app:
    labelSelector:
      app.kubernetes.io/name: devspace-app
      app.kubernetes.io/component: app
    container: balemoh
    namespace: "${BALEMOH_NAMESPACE}"
    command:
    - sh
    - -c
    - go run ./cmd/balemoh
    restartHelper:
      inject: true
    workingDir: /workspace
    ports:
    - port: 8080:8080
    sync:
    - path: ./:/workspace
      startContainer: true
      excludePaths:
      - .git/
      - .devspace/
      - data/
      - vendor/
      onUpload:
        restartContainer: true
  ui:
    labelSelector:
      app.kubernetes.io/name: devspace-app
      app.kubernetes.io/component: ui
    container: balemoh-ui
    devImage: golang:1.27-alpine
    namespace: "${BALEMOH_NAMESPACE}"
    command:
    - sh
    - -c
    - cd ui && go run ./cmd/balemoh-ui
    restartHelper:
      inject: true
    workingDir: /workspace
    ports:
    - port: 8081:8081
    sync:
    - path: ./:/workspace
      startContainer: true
      excludePaths:
      - .git/
      - .devspace/
      - data/
      - vendor/
      onUpload:
        restartContainer: true

pipelines:
  dev:
    run: |-
      create_deployments rbac
      create_deployments app ui
      start_dev app ui
  deploy:
    run: |-
      create_deployments rbac
      create_deployments app ui
  homelab:
    run: |-
      run_pipelines homelab-deploy
      start_dev app ui
  homelab-deploy:
    run: |-
      create_deployments rbac
      create_deployments app ui
      create_deployments route
  purge:
    run: |-
      stop_dev --all
      purge_deployments --all
  kind:
    run: |-
      ./hack/dev-k8s.sh kind
      run_pipelines dev
  vind:
    run: |-
      ./hack/dev-k8s.sh vind
      run_pipelines dev
