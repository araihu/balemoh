name: CI

on:
  pull_request:
  push:
    branches:
      - codex/balemoh-foundation

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated files
        run: |
          go generate ./...
          (cd client && GOWORK=off go generate ./...)
          (cd ui && GOWORK=off go generate ./...)
          git diff --exit-code

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/balemoh ./cmd/balemoh
          (cd ui && GOWORK=off go build -o /tmp/balemoh-ui ./cmd/balemoh-ui)

      - name: Vet
        run: |
          go vet ./...
          (cd client && GOWORK=off go vet ./...)
          (cd ui && GOWORK=off go vet ./...)

      - name: Race test
        run: |
          go test -race ./...
          (cd client && GOWORK=off go test -race ./...)
          (cd ui && GOWORK=off go test -race ./...)

      - name: Test nested modules
        env:
          CGO_ENABLED: "0"
        run: |
          (cd client && GOWORK=off go test ./...)
          (cd ui && GOWORK=off go test ./...)
