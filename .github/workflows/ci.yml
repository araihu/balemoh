name: CI

on:
  pull_request:
  push:
    branches:
      - codex/balemoh-foundation

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned protocol generators
        run: |
          curl -fsSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v33.0/protoc-33.0-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo /tmp/protoc/bin >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Check all plugin modules and generated consumers
        run: bash hack/check-plugin-modules.sh

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/balemoh ./cmd/balemoh
          (cd ui && GOWORK=off go build -o /tmp/balemoh-ui ./cmd/balemoh-ui)

      - name: Race test
        run: |
          go test -race ./...
          (cd client && GOWORK=off go test -race ./...)
          (cd ui && GOWORK=off go test -race ./...)
          (cd plugin-sdk && GOWORK=off go test -race ./...)


  image-smoke:
    name: API and UI image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: balemoh:check
          cache-from: type=gha
      - name: Check API and UI
        run: bash hack/smoke-image.sh balemoh:check
